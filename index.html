  drawer.classList.add('open');
  drawer.setAttribute('aria-hidden', 'false');
  document.body.classList.add('no-scroll');
  $('#cart-close').focus();
}

function closeCart() {
  const drawer = $('#cart-drawer');
  drawer.classList.remove('open');
  drawer.setAttribute('aria-hidden', 'true');
  $('#cart-overlay').hidden = true;
  document.body.classList.remove('no-scroll');
}

function initCart() {
  $('#cart-btn').addEventListener('click', openCart);
  $('#cart-close').addEventListener('click', closeCart);
  $('#cart-overlay').addEventListener('click', closeCart);
  $('#cart-empty-link').addEventListener('click', closeCart);
  $('#order-summary-btn').addEventListener('click', openCart);

  document.addEventListener('click', (e) => {
    const add = e.target.closest('[data-add]');
    if (add) {
      addToCart(add.dataset.add);
      return;
    }
    const inc = e.target.closest('[data-inc]');
    if (inc) {
      changeQty(inc.dataset.inc, 1);
      return;
    }
    const dec = e.target.closest('[data-dec]');
    if (dec) {
      changeQty(dec.dataset.dec, -1);
      return;
    }
    const remove = e.target.closest('[data-remove]');
    if (remove) {
      removeItem(remove.dataset.remove);
      return;
    }
    if (e.target.closest('[data-open-cart]')) {
      openCart();
    }
  });

  // Notes typing: update state only (no re-render, keeps focus).
  $('#cart-items').addEventListener('input', (e) => {
    const input = e.target.closest('[data-notes]');
    if (input) setItemNotes(input.dataset.notes, input.value);
  });

  syncCart();
}

/* ---------------- Validation helpers ---------------- */
function setError(inputId, errorId, message) {
  const input = document.getElementById(inputId);
  const err = document.getElementById(errorId);
  if (message) {
    input.classList.add('invalid');
    err.textContent = message;
    err.classList.add('visible');
  } else {
    input.classList.remove('invalid');
    err.textContent = '';
    err.classList.remove('visible');
  }
  return !message;
}

/* ---------------- Email dispatch (FormSubmit + mailto fallback) ---------------- */
async function sendEmail(subject, body, fromName, replyTo) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
  try {
    const res = await fetch(FORMSUBMIT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({
        name: fromName,
        email: replyTo || RESTAURANT.orderEmail,
        _subject: subject,
        message: body,
      }),
      signal: controller.signal,
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data || String(data.success) !== 'true') throw new Error('Unconfirmed');
    return true;
  } finally {
    clearTimeout(timer);
  }
}

function openMailto(subject, body) {
  const url =
    'mailto:' +
    RESTAURANT.orderEmail +
    '?subject=' +
    encodeURIComponent(subject) +
    '&body=' +
    encodeURIComponent(body);
  window.location.href = url;
}

/* ---------------- Checkout ---------------- */
function generateOrderId() {
  const d = new Date();
  const stamp =
    String(d.getFullYear()).slice(2) +
    String(d.getMonth() + 1).padStart(2, '0') +
    String(d.getDate()).padStart(2, '0');
  return 'ORD-' + stamp + '-' + Math.floor(1000 + Math.random() * 9000);
}

function buildOrderEmail(table, name, phone, orderId, notes) {
  const placed = new Intl.DateTimeFormat('en-IN', {
    dateStyle: 'medium',
    timeStyle: 'short',
  }).format(new Date());

  const lines = [
    '==================================================',
    `  DINE-IN ORDER - TABLE ${table.toUpperCase()}`,
    '  A COOKED AGAIN',
    '==================================================',
    '',
    `Order ID:  ${orderId}`,
    `Placed:    ${placed}`,
    '',
    'CUSTOMER DETAILS',
    '--------------------------------------------------',
    `Name:      ${name}`,
    `Phone:     ${phone}`,
    `Table No:  ${table}`,
    '',
    'ORDER ITEMS',
    '--------------------------------------------------',
  ];

  cart.forEach((item, i) => {
    lines.push(`${i + 1}) ${item.name}`);
    lines.push(`   Qty: ${item.quantity} x ${INR(item.price)} = ${INR(item.price * item.quantity)}`);
    if (item.notes.trim()) lines.push(`   Notes: ${item.notes.trim()}`);
    lines.push('');
  });

  lines.push('--------------------------------------------------');
  lines.push(`TOTAL AMOUNT: ${INR(cartTotal())}`);
  if (notes) {
    lines.push('');
    lines.push(`Order Notes: ${notes}`);
  }
  lines.push('');
  lines.push('==================================================');
  lines.push('Sent automatically from the restaurant website.');
  return lines.join('\n');
}

function validateCheckout() {
  const table = $('#co-table').value.trim();
  const name = $('#co-name').value.trim();
  const phone = $('#co-phone').value.trim();

  let ok = true;
  ok = setError('co-table', 'err-co-table',
    table.length >= 1 && table.length <= 10 ? '' : 'Table number is required.') && ok;
  ok = setError('co-name', 'err-co-name',
    name.length >= 2 && name.length <= 80 ? '' : 'Please enter your name.') && ok;
  ok = setError('co-phone', 'err-co-phone',
    PHONE_RE.test(phone) ? '' : 'Please enter a valid phone number.') && ok;
  return ok;
}

async function submitOrder(e) {
  e.preventDefault();
  if (cart.length === 0) {
    showToast('Your order is empty', 'Add at least one dish before checking out.', 'error');
    return;
  }
  if (!validateCheckout()) return;

  const table = $('#co-table').value.trim();
  const name = $('#co-name').value.trim();
  const phone = $('#co-phone').value.trim();
  const notes = $('#co-notes').value.trim().slice(0, MAX_ORDER_NOTES);
  const orderId = generateOrderId();
  const total = cartTotal();

  try {
    await persistOrder({ order_ref: orderId, table_number: table, customer_name: name, phone: phone, notes: notes, total_amount: total }, cart);
  } catch (err) {
    console.error('Supabase order save failed:', err);
    btn.disabled = false;
    btn.innerHTML = ICONS.utensils + `<span id="place-order-label">Place Order · ${INR(total)}</span>`;
    showToast('Order could not be saved', 'Please check your connection and try again.', 'error');
    return;
  }

  const subject = `[DINE-IN ORDER] Table ${table} - A COOKED AGAIN`;
  const body = buildOrderEmail(table, name, phone, orderId, notes);

  const btn = $('#place-order-btn');
  btn.disabled = true;
  btn.innerHTML = ICONS.loader + '<span>Placing your order&hellip;</span>';

  let delivered = false;
  try {
    delivered = await sendEmail(subject, body, name, RESTAURANT.orderEmail);
  } catch {
    delivered = false;
  }

  btn.disabled = false;
  btn.innerHTML = ICONS.utensils + `<span id="place-order-label">Place Order \u00B7 ${INR(total)}</span>`;

  // Reset cart + form regardless: the message is in flight one way or another.
  cart = [];
  $('#checkout-form').reset();
  syncCart();
  closeCart();

  if (delivered) {
    showOrderSuccess(orderId, table, total);
  } else {
    openMailto(subject, body);
    showToast(
      'Opening your email app',
      'Automatic dispatch was unavailable \u2014 we have prepared the order email for you. Just press send.',
      'error'
    );
  }
}

function showOrderSuccess(orderId, table, total) {
  $('#order-confirm-number').textContent = '#' + orderId;
  $('#order-confirm-details').innerHTML =
    `Table <strong>${esc(table)}</strong> &middot; Total <strong>${INR(total)}</strong>`;
  const modal = $('#order-modal');
  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');
  document.body.classList.add('no-scroll');
}

async function getOptionalAuthUserId() {
  try { if (!window.sb) return null; var r = await window.sb.auth.getSession(); return r.data && r.data.session && r.data.session.user ? r.data.session.user.id : null; } catch (e) { return null; }
}

async function persistReservation(payload) {
  var userId = await getOptionalAuthUserId();
  var row = Object.assign({}, payload, { user_id: userId });
  var r = await window.sb.from('reservations').insert(row).select('booking_ref').single();
  if (r.error) throw r.error;
  return r.data;
}

async function persistOrder(payload, items) {
  var userId = await getOptionalAuthUserId();
  var r = await window.sb.from('orders').insert(Object.assign({}, payload, { user_id: userId })).select('id').single();
  if (r.error) throw r.error;
  var rows = items.map(function (it) { return { order_id: r.data.id, item_name: it.name, unit_price: it.price, quantity: it.quantity, notes: it.notes || '' }; });
  r = await window.sb.from('order_items').insert(rows);
  if (r.error) throw r.error;
  return r.data;
}

async function persistFeedback(payload) {
  var userId = await getOptionalAuthUserId();
  var r = await window.sb.from('feedback').insert(Object.assign({}, payload, { user_id: userId }));
  if (r.error) throw r.error;
}

/* ---------------- Reservation ---------------- */
function validateReservation() {
  const name = $('#res-name').value.trim();
  const email = $('#res-email').value.trim();
  const phone = $('#res-phone').value.trim();
  const guests = Number($('#res-guests').value);
  const date = $('#res-date').value;
  const time = $('#res-time').value;
  const seating = $('#res-seating').value;

  let ok = true;
  ok = setError('res-name', 'err-res-name', name.length >= 2 ? '' : 'Please enter your name.') && ok;
  ok = setError('res-email', 'err-res-email', EMAIL_RE.test(email) ? '' : 'Please enter a valid email address.') && ok;
  ok = setError('res-phone', 'err-res-phone', PHONE_RE.test(phone) ? '' : 'Please enter a valid phone number.') && ok;
  ok = setError(
    'res-guests',
    'err-res-guests',
    Number.isInteger(guests) && guests >= 1 && guests <= 20 ? '' : 'Guests must be between 1 and 20.'
  ) && ok;

  let dateErr = '';
  if (!date) {
    dateErr = 'Please choose a date.';
  } else if (date < todayISO()) {
    dateErr = 'Reservation date cannot be in the past.';
  } else if (new Date(date + 'T00:00:00').getDay() === 6) {
    dateErr = 'We are closed on Saturdays \u2014 please pick another day.';
  }
  ok = setError('res-date', 'err-res-date', dateErr) && ok;

  let timeErr = '';
  if (!time) {
    timeErr = 'Please choose a time.';
  } else {
    const [h, m] = time.split(':').map(Number);
    const minutes = h * 60 + m;
    if (minutes < 6 * 60 || minutes > 22 * 60) {
      timeErr = 'We serve from 06:00 AM to 10:00 PM only.';
    }
  }
  ok = setError('res-time', 'err-res-time', timeErr) && ok;
  ok = setError('res-seating', 'err-res-seating', seating ? '' : 'Please choose a seating preference.') && ok;

  return ok;
}

function seatingLabel(value) {
  if (value === 'indoor') return 'Indoor (Main dining room)';
  if (value === 'outdoor') return 'Outdoor (Patio)';
  return 'No Preference';
}

async function submitReservation(e) {
  e.preventDefault();
  if (!validateReservation()) return;

  const name = $('#res-name').value.trim();
  const email = $('#res-email').value.trim();
  const phone = $('#res-phone').value.trim();
  const guests = $('#res-guests').value;
  const date = $('#res-date').value;
  const time = $('#res-time').value;
  const seating = $('#res-seating').value;
  const notes = $('#res-notes').value.trim();

  const btn = $('#res-submit');
  btn.disabled = true;
  btn.innerHTML = ICONS.loader + '<span>Reserving Your Table&hellip;</span>';

  let bookingRef = 'RES-' + Math.floor(100000 + Math.random() * 900000);
  let success = false;

  try {
    const saved = await persistReservation({
      booking_ref: bookingRef,
      name,
      email,
      phone,
      reservation_date: date,
      reservation_time: time,
      guests_count: Number(guests),
      seating: seatingLabel(seating),
      notes,
    });
    if (saved && saved.booking_ref) bookingRef = saved.booking_ref;
    success = true;
  } catch (err) {
    console.error('Supabase reservation save failed:', err);
    showToast('Reservation could not be saved', 'Please check your connection and try again.', 'error');
  }

  // Email dispatch is best-effort after the database save.
  let emailDelivered = false;
  if (success) {
    const subject = `[TABLE RESERVATION] ${name} - ${date} ${time} | A COOKED AGAIN`;
    const body = [
      '==================================================',
      '  NEW TABLE RESERVATION',
      '  A COOKED AGAIN',
      '==================================================',
      '',
      `Booking Ref:  ${bookingRef}`,
      `Name:         ${name}`,
      `Email:        ${email}`,
      `Phone:        ${phone}`,
      `Date:         ${date}`,
      `Time:         ${time}`,
      `Guests:       ${guests}`,
      `Seating:      ${seatingLabel(seating)}`,
      notes ? `Notes:        ${notes}` : '',
      '',
      'Sent automatically from the A COOKED AGAIN restaurant website.',
    ]
      .filter(Boolean)
      .join('\n');

    try {
      emailDelivered = await sendEmail(subject, body, name, email);
    } catch {
      emailDelivered = false;
    }
  }

  btn.disabled = false;
  btn.innerHTML = ICONS.calendar + '<span>Book Now</span>';
  if (!success) return;
  if (!emailDelivered) showToast('Reservation saved', 'Your booking is stored in Supabase. Email notification was unavailable.', 'error');

  // Display the professional Reservation Confirmed modal
  const modal = $('#res-confirmed-modal');
  if (modal) {
    $('#rc-ref').textContent = bookingRef;

/* ---------------- Feedback ---------------- */
function validateFeedback() {
  const name = $('#fb-name').value.trim();
  const email = $('#fb-email').value.trim();
  const message = $('#fb-message').value.trim();

  let ok = true;
  ok = setError('fb-name', 'err-fb-name', name.length >= 2 ? '' : 'Please enter your name.') && ok;
  ok = setError('fb-email', 'err-fb-email', EMAIL_RE.test(email) ? '' : 'Please enter a valid email address.') && ok;
  ok = setError('fb-message', 'err-fb-message', message.length >= 5 ? '' : 'Please share a few words with us.') && ok;
  return ok;
}

async function submitFeedback(e) {
  e.preventDefault();
  if (!validateFeedback()) return;

  const name = $('#fb-name').value.trim();
  const email = $('#fb-email').value.trim();
  const message = $('#fb-message').value.trim();

  const subject = `[FEEDBACK] ${name} | A COOKED AGAIN`;
  const body = [
    '==================================================',
    '  CUSTOMER FEEDBACK',
    '  A COOKED AGAIN',
    '==================================================',
    '',
    `Name:   ${name}`,
    `Email:  ${email}`,
    '',
    'Feedback:',
    '--------------------------------------------------',
    message,
    '',
    'Sent automatically from the restaurant website.',
  ].join('\n');

  const btn = $('#fb-submit');
  btn.disabled = true;
  btn.innerHTML = ICONS.loader + '<span>Sending&hellip;</span>';

  try { await persistFeedback({ name: name, email: email, message: message }); } catch (err) { console.error('Supabase feedback save failed:', err); btn.disabled = false; btn.innerHTML = ICONS.heart + '<span>Submit Feedback</span>'; showToast('Feedback could not be saved', 'Please check your connection and try again.', 'error'); return; }

  let delivered = false;
  try {
    delivered = await sendEmail(subject, body, name, email);
  } catch {
    delivered = false;
  }

  btn.disabled = false;
  btn.innerHTML = ICONS.heart + '<span>Submit Feedback</span>';

  if (delivered) {
    showToast('Thank you!', 'Your feedback has been received. Life cooked you \u2014 we cooked it better!');
    e.target.reset();
  } else {
    openMailto(subject, body);
    showToast(
      'Opening your email app',
      'Automatic dispatch was unavailable \u2014 your feedback is pre-filled. Just press send.',
      'error'
    );
  }
}

/* ---------------- Luxury Vintage Watch / Heritage Clock ---------------- */
function initHeritageClock() {
  const hourEl = $('#watch-hour');
  const minEl = $('#watch-min');
  const secEl = $('#watch-sec');
  const dateDayEl = $('#watch-date-day');
  const digitalEl = $('#clock-digital');
  const dateStrEl = $('#clock-date-str');
  const statusBadgeEl = $('#restaurant-status-badge');
  const statusTextEl = $('#restaurant-status-text');

  if (!hourEl || !minEl || !secEl) return;

  function updateClock() {
    const now = new Date();

    // Indian Standard Time calculation (UTC+5:30)
    const istOffset = 5.5 * 60;
    const localOffset = -now.getTimezoneOffset();
    const istTime = new Date(now.getTime() + (istOffset - localOffset) * 60000);

    const seconds = istTime.getSeconds();
    const minutes = istTime.getMinutes();
    const hours = istTime.getHours();
    const day = istTime.getDate();
    const dayOfWeek = istTime.getDay(); // 0 is Sunday, 6 is Saturday

    // Rotation angles for Roman numeral dial (smooth analog feel)
    const secDeg = (seconds / 60) * 360;
    const minDeg = ((minutes + seconds / 60) / 60) * 360;
    const hourDeg = (((hours % 12) + minutes / 60) / 12) * 360;

    secEl.style.transform = `translateX(-50%) rotate(${secDeg}deg)`;
    minEl.style.transform = `translateX(-50%) rotate(${minDeg}deg)`;
    hourEl.style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;

    if (dateDayEl) dateDayEl.textContent = String(day).padStart(2, '0');

    // Digital readout
    const timeFormatted = istTime.toLocaleTimeString('en-IN', {
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: true
    }).toUpperCase();

    if (digitalEl) digitalEl.textContent = `${timeFormatted} IST`;

    const dateFormatted = istTime.toLocaleDateString('en-IN', {
      weekday: 'long',
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });
    if (dateStrEl) dateStrEl.textContent = dateFormatted;

    // Restaurant Status: Mon-Fri & Sun 06:00 to 22:00. Saturday Holiday.
    const isOpen = dayOfWeek !== 6 && hours >= 6 && hours < 22;
    if (statusBadgeEl && statusTextEl) {
      if (isOpen) {
        statusBadgeEl.classList.remove('closed');
        statusTextEl.textContent = 'OPEN NOW \u2022 WELCOMING GUESTS';
      } else {
        statusBadgeEl.classList.add('closed');
        statusTextEl.textContent = dayOfWeek === 6 ? 'SATURDAY HOLIDAY \u2022 CLOSED' : 'CLOSED NOW \u2022 OPENS 06:00 AM';
      }
    }
  }

  updateClock();
  setInterval(updateClock, 1000);
}

/* ---------------- Luxury Heritage Calendar Date Picker ---------------- */
let calCurrentYear = new Date().getFullYear();
let calCurrentMonth = new Date().getMonth();
let calSelectedDate = ''; // 'YYYY-MM-DD'

function initHeritageCalendar() {
  const container = $('#heritage-calendar');
  const hiddenInput = $('#res-date');
  const prevBtn = $('#cal-prev');
  const nextBtn = $('#cal-next');
  const monthTitle = $('#cal-month-title');
  const grid = $('#cal-grid');
  const selectedDisplay = $('#cal-selected-display');

  if (!container || !grid) return;

  // Initialize selected date to tomorrow (or Sunday if tomorrow is Saturday)
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  if (tomorrow.getDay() === 6) {
    tomorrow.setDate(tomorrow.getDate() + 1);
  }
  const initISO = tomorrow.toISOString().split('T')[0];
  calSelectedDate = initISO;
  hiddenInput.value = initISO;
  updateSelectedDisplay();

  calCurrentYear = tomorrow.getFullYear();
  calCurrentMonth = tomorrow.getMonth();

  function renderCalendar() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const todayISOStr = today.toISOString().split('T')[0];

    const firstDayIndex = new Date(calCurrentYear, calCurrentMonth, 1).getDay();
    const daysInMonth = new Date(calCurrentYear, calCurrentMonth + 1, 0).getDate();

    const monthNames = [
      'January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'
    ];
    monthTitle.textContent = `${monthNames[calCurrentMonth]} ${calCurrentYear}`;

    // Disable prev button if in current month and year
    if (calCurrentYear === today.getFullYear() && calCurrentMonth === today.getMonth()) {
      prevBtn.disabled = true;
    } else {
      prevBtn.disabled = false;
    }

    grid.innerHTML = '';

    // Empty cells before first day
    for (let i = 0; i < firstDayIndex; i++) {
      const emptyCell = document.createElement('div');
      emptyCell.className = 'cal-day disabled';
      grid.appendChild(emptyCell);
    }

    // Days
    for (let day = 1; day <= daysInMonth; day++) {
      const dayDate = new Date(calCurrentYear, calCurrentMonth, day);
      dayDate.setHours(0, 0, 0, 0);
      const dayOfWeek = dayDate.getDay();
      const iso = `${calCurrentYear}-${String(calCurrentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cal-day';
      btn.textContent = day;

      const isPast = dayDate < today;
      const isSaturday = dayOfWeek === 6;

      if (iso === todayISOStr) {
        btn.classList.add('today');
      }

      if (iso === calSelectedDate) {
        btn.classList.add('selected');
      }

      if (isPast) {
        btn.classList.add('disabled');
        btn.setAttribute('aria-disabled', 'true');
      } else if (isSaturday) {
        btn.classList.add('disabled', 'saturday');
        btn.setAttribute('aria-disabled', 'true');
        btn.title = 'Saturday Holiday \u2014 Closed';
        const sub = document.createElement('span');
        sub.className = 'subtext';
        sub.textContent = 'Closed';
        btn.appendChild(sub);
      } else {
        btn.addEventListener('click', () => {
          calSelectedDate = iso;
          hiddenInput.value = iso;
          setError('res-date', 'err-res-date', '');
          updateSelectedDisplay();
          renderCalendar();
        });
      }

      grid.appendChild(btn);
    }
  }

  function updateSelectedDisplay() {
    if (!calSelectedDate) {
      selectedDisplay.textContent = 'Please choose a dining date above';
      return;
    }
    const [y, m, d] = calSelectedDate.split('-').map(Number);
    const dateObj = new Date(y, m - 1, d);
    const formatted = dateObj.toLocaleDateString('en-IN', {
      weekday: 'short',
      day: 'numeric',
      month: 'short',
      year: 'numeric'
    });
    selectedDisplay.textContent = `Selected: ${formatted}`;
  }

  prevBtn.addEventListener('click', () => {
    calCurrentMonth--;
    if (calCurrentMonth < 0) {
      calCurrentMonth = 11;
      calCurrentYear--;
    }
    renderCalendar();
  });

  nextBtn.addEventListener('click', () => {
    calCurrentMonth++;
    if (calCurrentMonth > 11) {
      calCurrentMonth = 0;
      calCurrentYear++;
    }
    renderCalendar();
  });

  renderCalendar();
}

/* ---------------- Reveal on scroll ---------------- */
function initReveal() {
  const targets = $$('.reveal');
  if (!('IntersectionObserver' in window)) {
    targets.forEach((el) => el.classList.add('visible'));
    return;
  }
  const io = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          io.unobserve(entry.target);
        }
      });
    },
    { threshold: 0.12 }
  );
  targets.forEach((el) => io.observe(el));
}

/* ---------------- Global keyboard ---------------- */
function initKeyboard() {
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      hideLightbox();
      closeCart();
      const modal = $('#order-modal');
      if (modal && modal.classList.contains('open')) {
        modal.classList.remove('open');
        modal.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('no-scroll');
      }
      const rcModal = $('#res-confirmed-modal');
      if (rcModal && !rcModal.hidden) {
        rcModal.hidden = true;
        document.body.classList.remove('no-scroll');
      }
    }
    if (lbIndex >= 0) {
      if (e.key === 'ArrowLeft') showLightbox(lbIndex - 1);
      if (e.key === 'ArrowRight') showLightbox(lbIndex + 1);
    }
  });
}

  }

  function refreshThumb(itemEl, src) {
    var thumb = itemEl ? itemEl.querySelector('.g-thumb') : null;
    if (!thumb) return;
    var ok = /^(https?:\/\/|data:image\/)/i.test(String(src || '').trim());
    thumb.innerHTML = ok ? '<img src="' + esc(src) + '" alt="">' : '<span class="g-thumb-empty">No photo yet</span>';
  }

  /* Client-side compression: image file -> JPEG data URL (max ~1400px). */
  function fileToCompressedDataUrl(file, maxDim, quality) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('Could not read the file.')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('That file is not a valid image.')); };
        img.onload = function () {
          try {
            var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
            var w = Math.max(1, Math.round(img.width * scale));
            var h = Math.max(1, Math.round(img.height * scale));
            var canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          } catch (err) {
            reject(err);
          }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function handleUpload(input) {
    var i = Number(input.dataset.gupload);
    var file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    if (!gallery[i]) return;
    if (!/^image\//.test(file.type)) {
      notify('Not an image', 'Please choose an image file (JPG, PNG, WebP...).', 'error');
      return;
    }
    if (file.size > 15 * 1024 * 1024) {
      notify('Photo too large', 'Please choose an image smaller than 15 MB.', 'error');
      return;
    }
    fileToCompressedDataUrl(file, 1400, 0.8)
      .then(function (dataUrl) {
        gallery[i].src = dataUrl;
        var item = byId('gallery-editor').querySelector('[data-gitem="' + i + '"]');
        if (item) {
          var srcInput = item.querySelector('[data-g="src"]');
          if (srcInput) srcInput.value = dataUrl;
          refreshThumb(item, dataUrl);
        }
        markDirty();
        notify('Photo attached', 'Image compressed and ready. Remember to Save.');
      })
      .catch(function (err) {
        notify('Upload failed', (err && err.message) || 'Could not process that image.', 'error');
      });
  }

  /* ---------- Validation ---------- */
  function validateMenu() {
    var errors = [];
    menu.forEach(function (cat) {
      var label = String(cat.title).trim() || 'Untitled category';
      if (!String(cat.title).trim()) errors.push('A category is missing its title.');
      if (!cat.items.length) errors.push('"' + label + '" has no dishes.');
      cat.items.forEach(function (item) {
        if (!String(item.name).trim()) {
          errors.push('"' + label + '" has a dish without a name.');
          return;
        }
        var p = Number(item.price);
        if (!Number.isFinite(p) || p < 0) errors.push('"' + label + '" has an invalid price.');
        else if (Math.round(p) !== p) errors.push('Prices must be whole rupees - check "' + label + '".');
      });
    });
    return errors;
  }

  function validateGallery() {
    var errors = [];
    if (!gallery.length) {
      errors.push('The gallery needs at least one photo.');
      return errors;
    }
    gallery.forEach(function (g, i) {
      var src = String((g && g.src) || '').trim();
      if (!src) errors.push('Photo #' + (i + 1) + ' has no image - paste a link or upload a file.');
      else if (!/^(https?:\/\/|data:image\/)/i.test(src)) errors.push('Photo #' + (i + 1) + ': the link must start with http:// or https://.');
    });
    return errors;
  }

  function firstError(errors) {
    if (!errors.length) return null;
    return errors[0] + (errors.length > 1 ? ' (and ' + (errors.length - 1) + ' more issue' + (errors.length > 2 ? 's' : '') + ')' : '');
  }

  /* ---------- Actions ---------- */
  async function doSave() {
    var msg = firstError(validateMenu().concat(validateGallery()));
    if (msg) {
      notify('Cannot save yet', msg, 'error');
      return;
    }
    var menuOk = await saveMenu(menu);
    var galleryOk = await saveGallery(gallery);
    if (menuOk && galleryOk) {
      clearDirty();
      renderSource();
      notify('Changes saved', 'Menu and gallery are now updated in Supabase for all visitors.');
    } else if (menuOk) {
      notify('Gallery save failed', 'The menu was saved, but Supabase rejected the gallery update. Check the image data and RLS policies.', 'error');
    } else {
      notify('Save failed', 'Supabase rejected the update. Check your connection and admin permissions.', 'error');
    }
  }

  async function doReset() {
    if (!window.confirm('Reset the menu AND gallery to the built-in defaults? The database content will be replaced with the built-in defaults.')) return;
    resetMenu();
    resetGallery();
    menu = await loadMenu();
    gallery = await loadGallery();
    currentCatIndex = 0;
    clearDirty();
    renderTabs();
    renderEditor();
    renderGalleryEditor();
    renderSource();
    notify('Everything reset', 'The default menu and gallery have been restored in Supabase.');
  }


  /* ---------- View switching ---------- */
  function setView(view) {
    currentView = view;
    $$('[data-view]').forEach(function (btn) {
      var active = btn.dataset.view === view;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-selected', String(active));
    });
    byId('menu-view').hidden = view !== 'menu';
    byId('gallery-view').hidden = view !== 'gallery';
    byId('reservations-view').hidden = view !== 'reservations';
    if (view === 'reservations' && !resLoaded && !resLoading) {
      loadReservations(false);
    }
  }

  /* ---------- Init ---------- */
  async function init() {
    var user = await getCurrentUser();
    if (!isAdminUser(user)) {
      byId('admin-workspace').hidden = true;
      byId('admin-toolbar').hidden = true;
      byId('admin-access').hidden = false;
      notify('Access denied', 'Only the administrator can open the Admin Panel.', 'error');
      setTimeout(function () { window.location.href = 'login.html'; }, 2400);
      return;
    }

    byId('admin-user').textContent = user.name + ' \u00B7 Admin';
    byId('admin-logout').addEventListener('click', async function () {
      await logoutUser();
      window.location.href = 'index.html';
    });

    menu = await loadMenu();
    gallery = await loadGallery();
    renderTabs();
    renderEditor();
    renderGalleryEditor();
    renderSource();

    // Top-level view tabs.
    $$('[data-view]').forEach(function (btn) {
      btn.addEventListener('click', function () { setView(btn.dataset.view); });
    });

    // Menu category tabs.
    byId('admin-tabs').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-cat]');
      if (!btn) return;
      currentCatIndex = Number(btn.dataset.cat);
      renderTabs();
      renderEditor();
    });

    // Menu editor: live model updates (no re-render so typing stays smooth).
    byId('admin-editor').addEventListener('input', function (e) {
      var cat = menu[currentCatIndex];
      var target = e.target;
      if (!target || !target.dataset) return;

      if (target.dataset.meta) {
        cat[target.dataset.meta] = target.value;
        markDirty();
        return;
      }
      if (target.classList.contains('dish-name') && target.dataset.index !== undefined) {
        cat.items[Number(target.dataset.index)].name = target.value;
        markDirty();
        return;
      }
      if (target.classList.contains('dish-price') && target.dataset.index !== undefined) {
        if (target.value !== '') {
          var n = Number(target.value);
          if (Number.isFinite(n)) cat.items[Number(target.dataset.index)].price = n;
        }
        markDirty();
        return;
      }
      if (target.classList.contains('dish-img') && target.dataset.index !== undefined) {
        cat.items[Number(target.dataset.index)].img = target.value.trim();
        markDirty();
      }
    });

    // Menu editor: refresh dish thumbnail when a photo link is pasted.
    byId('admin-editor').addEventListener('change', function (e) {
      var t = e.target;
      if (t && t.classList && t.classList.contains('dish-img') && t.dataset.index !== undefined) {
        var row = t.closest('.admin-dish-row');
        var thumb = row ? row.querySelector('.dish-thumb') : null;
        if (!thumb) return;
        var ok = /^(https?:\/\/|data:image\/)/i.test(String(t.value || '').trim());
        thumb.innerHTML = ok ? '<img src="' + esc(t.value.trim()) + '" alt="">' : '<span class="g-thumb-empty">No photo</span>';
      }
    });

    // Menu editor: delete + add dishes.
    byId('admin-editor').addEventListener('click', function (e) {
      var del = e.target.closest('[data-delete]');
      if (del) {
        var idx = Number(del.dataset.delete);
        var item = menu[currentCatIndex].items[idx];
        var label = item ? item.name : 'this dish';
        if (window.confirm('Delete "' + label + '" from ' + menu[currentCatIndex].title + '?')) {
          menu[currentCatIndex].items.splice(idx, 1);
          markDirty();
          renderTabs();
          renderEditor();
        }
        return;
      }

      if (e.target.closest('#add-dish-btn')) {
        var nameInput = byId('new-dish-name');
        var priceInput = byId('new-dish-price');
        var imgInput = byId('new-dish-img');
        var name = nameInput.value.trim();
        var price = Math.round(Number(priceInput.value));
        var img = imgInput ? imgInput.value.trim() : '';

        if (name.length < 2) {
          notify('Missing name', 'Please enter a dish name (at least 2 characters).', 'error');
          nameInput.focus();
          return;
        }
        if (!Number.isFinite(price) || price < 0 || priceInput.value === '') {
          notify('Invalid price', 'Please enter a valid price in whole rupees (0 or more).', 'error');
          priceInput.focus();
          return;
        }
        if (img && !/^(https?:\/\/|data:image\/)/i.test(img)) {
          notify('Invalid photo link', 'The dish photo link must start with http:// or https://.', 'error');
          imgInput.focus();
          return;
        }
        menu[currentCatIndex].items.push({ name: name, price: price, img: img });
        markDirty();
        renderTabs();
        renderEditor();
        notify('Dish added', name + ' added to ' + menu[currentCatIndex].title + '. Remember to save.');
      }
    });

    // Gallery editor: live text updates.
    var gwrap = byId('gallery-editor');
    gwrap.addEventListener('input', function (e) {
      var t = e.target;
      if (t && t.dataset && t.dataset.g && t.dataset.i !== undefined) {
        var item = gallery[Number(t.dataset.i)];
        if (!item) return;
        item[t.dataset.g] = t.value;
        markDirty();
      }
    });

    // Gallery editor: file uploads + refresh thumbnail when a link is pasted.
    gwrap.addEventListener('change', function (e) {
      var t = e.target;
      if (t && t.dataset && t.dataset.gupload !== undefined) {
        handleUpload(t);
        return;
      }
      if (t && t.dataset && t.dataset.g === 'src') {
        refreshThumb(t.closest('[data-gitem]'), t.value);
      }
    });

    // Gallery editor: reorder / delete / add.
    gwrap.addEventListener('click', function (e) {
      var up = e.target.closest('[data-gup]');
      var down = e.target.closest('[data-gdown]');
      var del = e.target.closest('[data-gdelete]');
      var add = e.target.closest('#add-photo-btn');

      if (up) {
        var i = Number(up.dataset.gup);
        if (i > 0) {
          var tmp = gallery[i - 1];
          gallery[i - 1] = gallery[i];
          gallery[i] = tmp;
          markDirty();
          renderGalleryEditor();
        }
        return;
      }
      if (down) {
        var j = Number(down.dataset.gdown);
        if (j < gallery.length - 1) {
          var t2 = gallery[j + 1];
          gallery[j + 1] = gallery[j];
          gallery[j] = t2;
          markDirty();
          renderGalleryEditor();
        }
        return;
      }
      if (del) {
        var k = Number(del.dataset.gdelete);
        var g = gallery[k];
        var label = g && (g.caption || g.alt) ? g.caption || g.alt : 'this photo';
        if (window.confirm('Delete "' + label + '" from the gallery?')) {
          gallery.splice(k, 1);
          markDirty();
          renderGalleryEditor();
        }
        return;
      }
      if (add) {
        if (gallery.length >= GALLERY_MAX_ITEMS) {
          notify('Gallery is full', 'You can keep up to ' + GALLERY_MAX_ITEMS + ' photos.', 'error');
          return;
        }
        gallery.push({ src: '', alt: '', caption: '' });
        markDirty();
        renderGalleryEditor();
        var last = byId('gallery-editor').querySelector('[data-gitem="' + (gallery.length - 1) + '"]');
        if (last) last.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });

    // Toolbar.
    byId('admin-save').addEventListener('click', doSave);
    byId('admin-reset').addEventListener('click', doReset);

    // Reservations workspace.
    byId('res-refresh').addEventListener('click', function () { loadReservations(true); });
    byId('res-export-excel').addEventListener('click', exportReservationsExcel);
    byId('res-export-csv').addEventListener('click', exportReservationsCSV);

    // Warn before leaving with unsaved changes.
    window.addEventListener('beforeunload', function (e) {
      if (dirty) {
        e.preventDefault();
        e.returnValue = '';
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function(){ if (location.hash !== '#admin') return; init(); });
})();

/* Login-page controller */

    (function () {
      'use strict';
      var byId = function (id) { return document.getElementById(id); };

      function fieldError(inputId, errId, msg) {
        var input = byId(inputId), err = byId(errId);
        if (msg) {
          input.classList.add('invalid');
          err.textContent = msg;
          err.classList.add('visible');
          return false;
        }
        input.classList.remove('invalid');
        err.textContent = '';
        err.classList.remove('visible');
        return true;
      }

      function setBusy(btn, busy, original) {
        btn.disabled = busy;
        btn.innerHTML = busy
          ? '<svg class="icon spin" aria-hidden="true"><use href="#icon-loader"/></svg><span>Please wait&hellip;</span>'
          : original;
      }

      document.addEventListener('DOMContentLoaded', async function () {
        // Validate Supabase configuration before making any network request.
        if (window.SB_CONFIG_ERROR) {
          notify('Supabase setup required', window.SB_CONFIG_ERROR, 'error');
        } else if (typeof window.sbDiagnose === 'function') {
          // Safe startup connection check (no credentials logged).
          window.sbDiagnose().then(function (d) {
            if (d && !d.ok) notify('Supabase connection problem', d.message, 'error');
          });
        }

        // Already signed in?
        var user = await getCurrentUser();
        if (user) {
          byId('auth-forms').hidden = true;
          byId('auth-signedin').hidden = false;
          byId('signedin-name').textContent = user.name.split(' ')[0];
          byId('signedin-role').textContent = isAdminUser(user)
            ? 'You are signed in as the Admin of this website.'
            : 'You are signed in to the restaurant.';
          if (!isAdminUser(user)) byId('signedin-admin').hidden = true;
          byId('signedin-logout').addEventListener('click', async function () {
            await logoutUser();
            window.location.reload();
          });
          return;
        }

        // First-user-becomes-admin notice.
        byId('first-admin-note').hidden = false;

        // Tabs.
        var tabBtns = document.querySelectorAll('[data-auth-tab]');
        Array.prototype.forEach.call(tabBtns, function (btn) {
          btn.addEventListener('click', function () {
            Array.prototype.forEach.call(tabBtns, function (b) {
              var active = b === btn;
              b.classList.toggle('active', active);
              b.setAttribute('aria-selected', String(active));
            });
            byId('signin-form').hidden = btn.dataset.authTab !== 'signin';
            byId('register-form').hidden = btn.dataset.authTab !== 'register';
          });
        });

        // Sign in.
        byId('signin-form').addEventListener('submit', async function (e) {
          e.preventDefault();
          var email = byId('si-email').value.trim();
          var password = byId('si-password').value;
          var ok = true;
          ok = fieldError('si-email', 'err-si-email', AUTH_EMAIL_RE.test(email) ? '' : 'Please enter a valid email address.') && ok;
          ok = fieldError('si-password', 'err-si-password', password ? '' : 'Please enter your password.') && ok;
          if (!ok) return;

          var btn = byId('signin-submit');
          var original = btn.innerHTML;
          setBusy(btn, true);
          var result = await loginUser(email, password);
          setBusy(btn, false, original);

          if (!result.ok) {
            notify('Sign in failed', result.error, 'error');
            return;
          }
          notify('Welcome back, ' + result.user.name.split(' ')[0] + '!', isAdminUser(result.user) ? 'Opening the Admin Panel\u2026' : 'Opening the restaurant\u2026');
          setTimeout(function () {
            window.location.hash = isAdminUser(result.user) ? '#admin' : '#home';
          }, 800);
        });

        // Register.
        byId('register-form').addEventListener('submit', async function (e) {
          e.preventDefault();
          var name = byId('rg-name').value.trim();
          var email = byId('rg-email').value.trim();
          var password = byId('rg-password').value;
          var confirm = byId('rg-confirm').value;
          var ok = true;
          ok = fieldError('rg-name', 'err-rg-name', name.length >= 2 ? '' : 'Please enter your full name.') && ok;
          ok = fieldError('rg-email', 'err-rg-email', AUTH_EMAIL_RE.test(email) ? '' : 'Please enter a valid email address.') && ok;
          ok = fieldError('rg-password', 'err-rg-password', AUTH_PASSWORD_RE.test(password) ? '' : 'Use 8–72 characters with uppercase, lowercase, number & special character.') && ok;
          ok = fieldError('rg-confirm', 'err-rg-confirm', password === confirm ? '' : 'Passwords do not match.') && ok;
          if (!ok) return;

          var btn = byId('register-submit');
          var original = btn.innerHTML;
          setBusy(btn, true);
          var result = await registerUser(name, email, password);
          setBusy(btn, false, original);

          if (!result.ok) {
            notify('Registration failed', result.error, 'error');
            return;
          }
          if (result.pendingConfirmation) {
            notify('Account created', 'Check your email to confirm the account, then use Sign In.', 'success');
            byId('tab-signin').click();
            byId('si-email').value = result.email || email.toLowerCase();
            return;
          }
          if (result.profileWarning) {
            notify('Account created', 'Signed in, but the profile record could not be read. Ask the site owner to run the latest supabase/schema.sql.', 'error');
          }
          if (isAdminUser(result.user)) {
            notify('Account created \u2014 you are the Admin!', 'You can now change dishes and prices. Opening the Admin Panel\u2026');
          } else {
            notify('Account created!', 'Welcome to A COOKED AGAIN. Opening the restaurant\u2026');
          }
          setTimeout(function () {
            window.location.hash = isAdminUser(result.user) ? '#admin' : '#home';
          }, 900);
        });
      });
    })();
  
</script>
