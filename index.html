<style>
/* ============================================================
   A COOKED AGAIN — Old Money & Heritage Fine Dining
   Deep Forest Green, Espresso, Cream/Ivory & Champagne Gold Accents
   Fonts: Playfair Display (display) / Cormorant Garamond (body)
   ============================================================ */

/* ---------- Design tokens (Old Money / Heritage Fine Dining) ---------- */
:root {
  --bg: #0d1a13;                /* Deep noble forest green background */
  --bg-raise: #13241b;          /* Slightly raised rich forest green */
  --bg-card: #16291e;           /* Heritage forest green card surface */
  --bg-espresso: #1f1712;       /* Refined espresso brown surface */
  --bg-deep: #08110c;           /* Deepest forest-black background */
  --fg: #f8f5ee;                /* Pure warm cream / ivory */
  --fg-muted: #c8c0af;          /* Muted champagne / sand ivory */
  --gold: #c8a876;              /* Subtle antique champagne gold */
  --gold-bright: #dfc89f;       /* Soft champagne gold highlight */
  --gold-deep: #8f7243;         /* Deep burnished bronze gold */
  --gold-subtle: rgba(200, 168, 118, 0.12); /* Subtle champagne wash */
  --border: rgba(200, 168, 118, 0.22);      /* Champagne hair-line border */
  --border-strong: rgba(200, 168, 118, 0.46);
  --danger: #d96262;
  --success: #52a878;
  --gradient-gold: linear-gradient(135deg, #dfc89f 0%, #c8a876 50%, #8f7243 100%);
  --shadow-card: 0 12px 32px -12px rgba(4, 10, 7, 0.75);
  --shadow-pop: 0 24px 64px -16px rgba(3, 8, 5, 0.9);
  --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
  --font-body: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --radius: 3px;
  --nav-h: 76px;
  --speed: 0.3s;
}

/* ---------- Reset & base ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body.no-scroll { overflow: hidden; }

img { display: block; max-width: 100%; }

a { color: var(--gold-bright); text-decoration: none; transition: color var(--speed) ease; }
a:hover { color: var(--gold); }

button { font-family: inherit; cursor: pointer; background: none; border: none; color: inherit; }
input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

section { scroll-margin-top: calc(var(--nav-h) + 8px); }

::selection { background: var(--gold); color: var(--bg); }

* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
*::-webkit-scrollbar-track { background: transparent; }

/* ---------- Icons ---------- */
.icon {
  width: 20px; height: 20px;
  fill: none; stroke: currentColor; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round;
  flex-shrink: 0;
}
.big-icon { width: 44px; height: 44px; color: var(--gold); opacity: 0.7; }

/* ---------- Layout utilities ---------- */
.container { width: 100%; max-width: 1152px; margin: 0 auto; padding: 0 20px; }
.container.narrow { max-width: 760px; }

.section { position: relative; padding: 88px 0; }
.section-alt { background-color: var(--bg-raise); }
.pattern {
  background-image:
    repeating-linear-gradient(45deg, transparent 0 22px, rgba(201, 151, 31, 0.035) 22px 24px),
    repeating-linear-gradient(-45deg, transparent 0 22px, rgba(201, 151, 31, 0.035) 22px 24px);
}

/* Section headings */
.section-head { text-align: center; max-width: 720px; margin: 0 auto 56px; }
.section-head.left { text-align: left; margin-left: 0; }

.eyebrow {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 14px;
}

.section-title {
  font-family: var(--font-display);
  font-size: clamp(30px, 5vw, 44px);
  font-weight: 700;
  line-height: 1.15;
  text-wrap: balance;
}

.section-desc { margin-top: 16px; font-size: 19px; color: var(--fg-muted); text-wrap: pretty; }
.section-desc.italic { font-style: italic; }

.ornament {
  display: flex; align-items: center; justify-content: center;
  gap: 16px; margin-top: 18px; color: var(--gold);
}
.section-head.left .ornament { justify-content: flex-start; }
.ornament-line { display: block; width: 64px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-deep)); }
.ornament-line:last-child { background: linear-gradient(90deg, var(--gold-deep), transparent); }
.ornament-svg { color: var(--gold); }

.panel-label {
  font-family: var(--font-body); font-size: 14px; font-weight: 600;
  letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--gold-bright); text-align: center;

}

.flame-note {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-size: 19px; font-weight: 600; color: var(--gold-bright);
  margin: -28px 0 40px; text-align: center;
}
.flame-note .icon { color: var(--gold); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 12px 24px;
  font-family: var(--font-body); font-size: 18px; font-weight: 600;
  letter-spacing: 0.04em; text-align: center;
  border: 1px solid transparent; border-radius: var(--radius);
  text-decoration: none; white-space: nowrap;
  transition: background var(--speed) ease, color var(--speed) ease,
    border-color var(--speed) ease, transform var(--speed) ease, box-shadow var(--speed) ease;
}
.btn .icon { width: 20px; height: 20px; }
.btn:active { transform: translateY(1px); }

.btn-primary {
  background: var(--gradient-gold);
  color: hsl(38, 30%, 7%);
  box-shadow: 0 8px 24px -10px rgba(201, 151, 31, 0.55);
}
.btn-primary:hover { filter: brightness(1.08); box-shadow: 0 12px 28px -10px rgba(201, 151, 31, 0.7); }

.btn-outline-gold {
  border-color: var(--border-strong);
  color: var(--gold-bright);
  background: transparent;
}
.btn-outline-gold:hover { border-color: var(--gold); background: rgba(201, 151, 31, 0.08); color: var(--gold); }

.btn-lg { min-height: 56px; padding: 14px 32px; font-size: 19px; }
.btn-block { width: 100%; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px;
  border: 1px solid var(--border-strong); border-radius: var(--radius);
  color: var(--gold-bright);
  transition: background var(--speed) ease, border-color var(--speed) ease, color var(--speed) ease;
}
.icon-btn:hover { background: rgba(201, 151, 31, 0.1); border-color: var(--gold); color: var(--gold); }

.gold-link { color: var(--gold-bright); }
.gold-link:hover { color: var(--gold); }

/* ---------- Cards & ornaments ---------- */
.card {
  position: relative;
  background-color: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
}

.card-title {
  font-family: var(--font-display);
  font-size: 24px; font-weight: 600;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
  color: var(--fg);
}

.corners-card { position: relative; }
.corner {
  position: absolute; width: 18px; height: 18px;
  border-color: var(--gold); border-style: solid; border-width: 0;
  opacity: 0.85; pointer-events: none;
}
.c-tl { top: 8px; left: 8px; border-top-width: 2px; border-left-width: 2px; }
.c-tr { top: 8px; right: 8px; border-top-width: 2px; border-right-width: 2px; }
.c-bl { bottom: 8px; left: 8px; border-bottom-width: 2px; border-left-width: 2px; }
.c-br { bottom: 8px; right: 8px; border-bottom-width: 2px; border-right-width: 2px; }

/* ---------- Navbar ---------- */
.navbar {
  position: fixed; inset: 0 0 auto 0; z-index: 100;
  height: var(--nav-h);
  border-bottom: 1px solid transparent;
  background: transparent;
  transition: background var(--speed) ease, border-color var(--speed) ease, box-shadow var(--speed) ease;
}
.navbar.scrolled {
  background: rgba(10, 8, 5, 0.92);
  border-bottom-color: var(--border);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 8px 24px -16px rgba(0, 0, 0, 0.9);
}

.nav-inner {
  max-width: 1280px; height: 100%;
  margin: 0 auto; padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}

.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand-logo-img {
  width: 52px; height: 52px;
  object-fit: contain;
  flex-shrink: 0;
  border-radius: 4px;
  filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
  transition: transform var(--speed) ease;
}
.brand:hover .brand-logo-img { transform: scale(1.03); }
.brand-mark {
  display: flex; align-items: center; justify-content: center;
  width: 38px; height: 38px; transform: rotate(45deg);
  border: 1px solid var(--gold); flex-shrink: 0;
}
.brand-mark span, .brand-mark { color: var(--gold); }
.brand-mark-inner {
  transform: rotate(-45deg);
  font-family: var(--font-display); font-size: 15px; font-weight: 700;
}
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-name {
  font-family: var(--font-display); font-size: 17px; font-weight: 600;
  letter-spacing: 0.04em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--fg);
}
.brand-sub {
  font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--gold-bright); opacity: 0.9;
}

.nav-links { display: none; align-items: center; gap: 28px; }
.nav-links a {
  font-size: 17px; font-weight: 500; color: var(--fg-muted);
  position: relative; padding: 4px 0;
}
.nav-links a::after {
  content: ''; position: absolute; left: 0; bottom: 0;
  width: 0; height: 1px; background: var(--gold);
  transition: width var(--speed) ease;
}
.nav-links a:hover { color: var(--gold-bright); }
.nav-links a:hover::after { width: 100%; }

.nav-actions { display: flex; align-items: center; gap: 12px; }
.nav-cta { display: none; min-height: 44px; padding: 10px 20px; font-size: 17px; }

.cart-btn { position: relative; }
.cart-badge {
  position: absolute; top: -7px; right: -7px;
  min-width: 21px; height: 21px; padding: 0 5px;
  display: flex; align-items: center; justify-content: center;
  background: var(--gradient-gold); color: hsl(38, 30%, 7%);
  font-family: var(--font-display); font-size: 12px; font-weight: 700;
  border-radius: 999px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
}

.hamburger { display: inline-flex; }

/* Mobile nav panel */
.mobile-nav {
  position: fixed; top: var(--nav-h); left: 0; right: 0; z-index: 99;
  background: rgba(10, 8, 5, 0.97);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(10px);
  display: flex; flex-direction: column; padding: 8px 20px 20px;
  transform: translateY(-12px); opacity: 0; visibility: hidden;
  transition: transform var(--speed) ease, opacity var(--speed) ease, visibility var(--speed) ease;
}
.mobile-nav.open { transform: translateY(0); opacity: 1; visibility: visible; }
.mobile-nav a {
  display: flex; align-items: center; min-height: 52px;
  font-size: 19px; font-weight: 500; color: var(--fg);
  border-bottom: 1px solid var(--border);
}
.mobile-nav a:hover { color: var(--gold-bright); }
.mobile-nav .mobile-cta {
  margin-top: 16px; border-bottom: none; color: hsl(38, 30%, 7%);
}

/* ---------- Hero ---------- */
.hero {
  position: relative; min-height: 92vh; min-height: 92svh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: calc(var(--nav-h) + 40px) 20px 88px;
  overflow: hidden;
}
.hero-bg { position: absolute; inset: 0; z-index: -2; }
.hero-bg img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
.hero-overlay {
  position: absolute; inset: 0; z-index: -1;

    linear-gradient(to bottom, rgba(10, 8, 5, 0.8), rgba(10, 8, 5, 0.2) 30%, rgba(10, 8, 5, 0.2) 65%, var(--bg));
}
.hero-frame {
  position: absolute; inset: 24px;
  border: 1px solid rgba(201, 151, 31, 0.35);
  pointer-events: none;
  display: none;
}

.hero-content { max-width: 860px; }
.hero .eyebrow { font-size: 13px; }

.hero-title {
  font-family: var(--font-display);
  font-size: clamp(42px, 9vw, 84px);
  font-weight: 800; line-height: 1.08;
  margin: 10px 0 22px;
  text-shadow: 0 4px 32px rgba(0, 0, 0, 0.8);
  text-wrap: balance;
}

.gradient-text {
  background: var(--gradient-gold);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}

.hero-tagline {
  font-size: clamp(20px, 3vw, 27px); font-style: italic;
  color: var(--fg); opacity: 0.95;
}
.hero-sub {
  margin-top: 8px; font-size: 18px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--gold-bright);
}
.hero-cta { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-top: 40px; }

.scroll-hint {
  position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
  color: var(--gold); opacity: 0.8;
  animation: bob 2.2s ease-in-out infinite;
}
@keyframes bob { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 8px); } }

/* ---------- About ---------- */
.about-grid { display: grid; grid-template-columns: 1fr; gap: 56px; align-items: center; }

.about-portrait { position: relative; padding: 20px 0 0 20px; }
.arch-outer {
  position: absolute; top: 0; left: 0; right: 28px; bottom: 28px;
  border: 1px solid var(--gold-deep);

  pointer-events: none;
}
.arch-frame {
  position: relative; overflow: hidden;
  border-radius: 999px 999px 0 0;
  border: 1px solid var(--gold);
  box-shadow: var(--shadow-card), 0 0 0 6px rgba(10, 8, 5, 0.6);
}
.arch-frame img { width: 100%; height: 100%; aspect-ratio: 4 / 4.6; object-fit: cover; }
.arch-caption {
  position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
  font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--gold-bright); white-space: nowrap;
  background: rgba(10, 8, 5, 0.72); padding: 6px 18px;
  border: 1px solid rgba(201, 151, 31, 0.4);
}

.about-content .section-title { margin-bottom: 6px; }
.lead { font-size: 20px; color: var(--fg-muted); line-height: 1.6; }

.stats-panel {
  display: grid; grid-template-columns: 1fr;
  gap: 20px; margin-top: 36px; padding: 28px 24px;
  background: linear-gradient(160deg, rgba(201, 151, 31, 0.07), rgba(138, 101, 38, 0.03));
  border: 1px solid var(--border);
}
.stat { display: flex; align-items: center; gap: 16px; }
.stat .icon { width: 28px; height: 28px; color: var(--gold); }
.stat-value { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--gold-bright); line-height: 1.1; }
.stat-label { font-size: 16px; color: var(--fg-muted); }

/* ---------- Best sellers ---------- */
.featured-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }

.dish-card { overflow: hidden; display: flex; flex-direction: column; height: 100%; }
.dish-card-img { position: relative; overflow: hidden; aspect-ratio: 4 / 3; }
.dish-card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
.dish-card:hover .dish-card-img img { transform: scale(1.05); }
.dish-badge {

  padding: 6px 14px;
  background: rgba(10, 8, 5, 0.85);
  border: 1px solid var(--gold);
  font-size: 12px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;

.dish-card-body { display: flex; flex-direction: column; flex: 1; padding: 22px 22px 24px; }
.dish-card-body h3 { font-family: var(--font-display); font-size: 22px; font-weight: 600; line-height: 1.25; text-wrap: balance; }
.dish-card-desc { margin-top: 8px; font-size: 17px; font-style: italic; color: var(--fg-muted); }
.dish-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; padding-top: 18px; }
.dish-price { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--gold-bright); }
.dish-card-foot .btn { min-height: 42px; padding: 8px 16px; font-size: 16px; }

/* Gilded price list */
.price-list { display: grid; grid-template-columns: 1fr; gap: 2px 48px; margin-top: 14px; }
.price-row {

  padding: 11px 4px;
  border-bottom: 1px solid rgba(201, 151, 31, 0.14);
}
.price-row-name { font-size: 19px; font-weight: 500; }
.price-row-leader { flex: 1; border-bottom: 1px dotted rgba(201, 151, 31, 0.4); transform: translateY(-4px); }
.price-row-price { font-family: var(--font-display); font-size: 19px; font-weight: 700; color: var(--gold-bright); }

.menu-container { max-width: 1000px; }

.order-hint {

.order-hint .icon { color: var(--gold); width: 18px; height: 18px; }

.tabs {

.tab-btn {

.tab-btn:hover { color: var(--gold-bright); }

.menu-panel { display: none; }

.menu-panel-head p { margin-top: 6px; font-style: italic; font-size: 17px; color: var(--fg-muted); }
.menu-panel-head .panel-note {

  font-size: 13px; font-style: normal; letter-spacing: 0.26em; text-transform: uppercase;
  color: var(--gold-bright); opacity: 0.85;
}

.menu-row {

  padding: 13px 0;
  border-bottom: 1px solid rgba(201, 151, 31, 0.14);
}

.menu-row-name { flex: 1 1 50%; min-width: 0; font-size: 18px; font-weight: 500; }

/* Medium dish photo shown next to each menu item */
.menu-row-thumb {
  flex: 0 0 auto;
  width: 92px; height: 68px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  overflow: hidden;
  background: linear-gradient(165deg, rgba(201, 151, 31, 0.10), rgba(10, 8, 5, 0) 60%), var(--bg-inset, #0b1f14);

}

  width: 100%; height: 100%;

  transition: transform 0.45s ease;
}
.menu-row:hover .menu-row-thumb img { transform: scale(1.06); }

}
.menu-row-thumb.thumb-failed::after {
  content: "ACA";
  font-family: var(--font-display);
  font-size: 15px; font-weight: 700; letter-spacing: 0.22em;
  color: var(--gold); opacity: 0.75;
}
@media (max-width: 560px) {
  .menu-row-thumb { width: 78px; height: 58px; }
  .menu-row-name { flex-basis: 100%; order: 2; font-size: 17px; }
  .menu-row-thumb { order: 1; }
  .menu-row-leader { display: none; }
  .menu-row-price { order: 3; margin-left: auto; }
}
.menu-row-leader { flex: 1 1 20px; border-bottom: 1px dotted rgba(201, 151, 31, 0.35); transform: translateY(-4px); }
.menu-row-price { font-family: var(--font-display); font-size: 19px; font-weight: 700; color: var(--gold-bright); }

.add-btn {
  min-height: 38px; padding: 6px 14px;
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border-strong); border-radius: var(--radius);
  font-size: 15px; font-weight: 700; color: var(--gold-bright);
  transition: all var(--speed) ease;
}
.add-btn:hover { background: var(--gradient-gold); color: hsl(38, 30%, 7%); border-color: var(--gold); }
.add-btn .icon { width: 16px; height: 16px; }

.stepper {
  display: inline-flex; align-items: center;
  border: 1px solid var(--border-strong); border-radius: var(--radius);
  overflow: hidden;
}
.stepper-btn {
  width: 36px; height: 38px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--gold-bright);
  transition: background var(--speed) ease;
}
.stepper-btn:hover { background: rgba(201, 151, 31, 0.12); }
.stepper-btn .icon { width: 16px; height: 16px; }
.stepper-qty {
  width: 36px; height: 38px;
  font-family: var(--font-display); font-size: 17px; font-weight: 700;
  color: var(--gold-bright);
  display: inline-flex; align-items: center; justify-content: center;
}
.stepper-qty:hover { color: var(--gold); }

.order-summary {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px;
  margin-top: 32px; padding: 24px;
  background: var(--bg-card); border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-card);
  animation: fadeIn 0.35s ease;
}
.order-summary p { font-size: 18px; }
.order-summary strong { font-family: var(--font-display); font-size: 22px; color: var(--gold-bright); }

/* ---------- Gallery ---------- */
.gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

.gallery-item {
  position: relative; overflow: hidden;
  aspect-ratio: 1 / 1;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: border-color var(--speed) ease;
  padding: 0; width: 100%; height: auto; display: block;
}
.gallery-item:hover, .gallery-item:focus-visible { border-color: var(--gold); }
.gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
.gallery-item:hover img { transform: scale(1.06); }
.gallery-item::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(10, 8, 5, 0.88) 0%, rgba(10, 8, 5, 0.15) 45%, transparent 70%);
}
.gallery-caption {
  position: absolute; inset-inline: 0; bottom: 0; z-index: 1;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 12px 14px;
  font-size: 15px; font-weight: 600; color: var(--fg);
  text-align: left;
}
.gallery-caption .icon { width: 16px; height: 16px; color: var(--gold); opacity: 0; transition: opacity var(--speed) ease; }
.gallery-item:hover .gallery-caption .icon { opacity: 1; }

/* ---------- Forms ---------- */
.res-grid { display: grid; grid-template-columns: 1fr; gap: 40px; align-items: start; }

.res-aside { position: relative; }
.res-aside img {
  width: 100%; aspect-ratio: 4 / 3; object-fit: cover;
  border: 1px solid var(--border-strong);
  border-radius: 999px 999px var(--radius) var(--radius);
  box-shadow: var(--shadow-card);
}
.res-aside-content { margin-top: 24px; display: flex; flex-direction: column; gap: 18px; }
.aside-item { display: flex; gap: 14px; align-items: flex-start; font-size: 18px; color: var(--fg-muted); }
.aside-item .icon { color: var(--gold); margin-top: 3px; }
.aside-item a { font-weight: 600; }

.form-card { padding: 32px 26px; }
.form-row { display: grid; grid-template-columns: 1fr; gap: 0 20px; }

.field { margin-bottom: 20px; display: flex; flex-direction: column; }
.field label {
  font-size: 15px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--fg-muted);
  margin-bottom: 8px;
}
.req { color: var(--gold); }

.field input, .field select, .field textarea {
  width: 100%; min-height: 50px;
  padding: 12px 14px;
  background: var(--bg);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  color: var(--fg); font-size: 18px;
  transition: border-color var(--speed) ease, box-shadow var(--speed) ease;
}
.field textarea { resize: vertical; min-height: 88px; }
.field input::placeholder, .field textarea::placeholder { color: var(--fg-muted); opacity: 0.6; }
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201, 151, 31, 0.18);
}
.field input.invalid, .field select.invalid, .field textarea.invalid { border-color: var(--danger); }

.field-error {
  display: none; margin-top: 6px;
  font-size: 15px; font-weight: 600; color: var(--danger);
}
.field-error.visible { display: block; }

/* Color for date/time picker icons on dark bg */
.field input[type="date"], .field input[type="time"] { color-scheme: dark; }

/* ---------- Hours & location ---------- */
.hours-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }

.contact-card { padding: 28px 24px; }
.contact-item { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 16px; font-size: 18px; }
.contact-item:last-child { margin-bottom: 0; }
.contact-item .icon { color: var(--gold); margin-top: 4px; }

.hours-card { padding: 28px 24px; }
.hours-list { list-style: none; }
.hours-list li {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 2px; font-size: 18px;
  border-bottom: 1px solid rgba(201, 151, 31, 0.14);
}
.hours-list li:last-child { border-bottom: none; }
.hours-list li span:first-child { font-weight: 600; }
.hours-list li span:last-child { color: var(--fg-muted); }
.holiday-badge {
  padding: 2px 12px;
  border: 1px solid var(--danger); border-radius: 999px;
  font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--danger) !important;
}

.map-card { padding: 28px 24px; }
.map-card iframe {
  width: 100%; height: 300px;
  border: 1px solid var(--border-strong); border-radius: var(--radius);
  filter: sepia(0.35) contrast(0.95) brightness(0.9);
}

/* ---------- Footer ---------- */
.footer {
  padding: 72px 0 40px;
  background:
    linear-gradient(to bottom, rgba(201, 151, 31, 0.05), transparent 30%),
    var(--bg-raise);
  border-top: 1px solid var(--border);
  text-align: center;
}
.footer-quote {
  font-family: var(--font-display);
  font-size: clamp(20px, 3vw, 28px); font-style: italic; font-weight: 500;
  max-width: 720px; margin: 0 auto;
}
.footer-ornament { margin: 22px auto 40px; }

.footer-grid {
  display: grid; grid-template-columns: 1fr; gap: 36px;
  text-align: left; max-width: 900px; margin: 0 auto;
}
.footer-heading {
  font-family: var(--font-display); font-size: 19px; font-weight: 600;
  color: var(--gold-bright); margin-bottom: 14px;
  letter-spacing: 0.06em;
}
.footer-item { display: flex; align-items: flex-start; gap: 12px; font-size: 17px; color: var(--fg-muted); margin-bottom: 10px; }
.footer-item .icon { width: 18px; height: 18px; color: var(--gold); margin-top: 4px; }

.footer-hairline {
  height: 1px; max-width: 420px; margin: 40px auto 28px;
  background: linear-gradient(90deg, transparent, var(--gold-deep), transparent);
}
.footer-thanks { font-size: 19px; font-weight: 600; color: var(--fg); }
.footer-copyright { margin-top: 8px; font-size: 15px; color: var(--fg-muted); }

/* ---------- Cart drawer ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 110;
  background: rgba(5, 4, 2, 0.7);
  backdrop-filter: blur(2px);
  animation: fadeIn 0.25s ease;
}

.cart-drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 120;
  width: 100%; max-width: 460px;
  display: flex; flex-direction: column;
  background: var(--bg);
  border-left: 1px solid var(--border-strong);
  box-shadow: var(--shadow-pop);
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  visibility: hidden;
}
.cart-drawer.open { transform: translateX(0); visibility: visible; }

.drawer-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 14px;
  padding: 20px 22px;
  border-bottom: 1px solid var(--border);
}
.drawer-title {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-display); font-size: 22px; font-weight: 700;
}
.drawer-title .icon { color: var(--gold); }
.drawer-sub { margin-top: 2px; font-size: 16px; color: var(--fg-muted); }

.cart-empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; padding: 32px; text-align: center;
}
.cart-empty p { font-size: 18px; color: var(--fg-muted); max-width: 300px; }

.cart-scroll { flex: 1; min-height: 0; overflow-y: auto; }
.cart-items { display: flex; flex-direction: column; gap: 14px; padding: 18px 22px; }

.cart-item {
  padding: 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-card);
}
.cart-item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.cart-item-name { font-size: 18px; font-weight: 600; text-wrap: balance; }
.cart-item-meta { margin-top: 2px; font-size: 15px; color: var(--fg-muted); }
.cart-item-remove { color: var(--fg-muted); padding: 6px; }
.cart-item-remove:hover { color: var(--danger); }
.cart-item-remove .icon { width: 18px; height: 18px; }

.cart-item-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
.cart-item-total { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--gold-bright); }
.cart-item-notes { margin-top: 12px; }
.cart-item-notes input {
  width: 100%; min-height: 44px; padding: 10px 12px;
  background: var(--bg);
  border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 16px; color: var(--fg);
}
.cart-item-notes input::placeholder { color: var(--fg-muted); opacity: 0.65; }
.cart-item-notes input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201, 151, 31, 0.18); }

.cart-checkout {
  padding: 20px 22px 24px;
  border-top: 1px solid var(--border-strong);
  background: var(--bg-raise);
  overflow-y: auto; max-height: 55%;
}
.cart-total-row {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 16px;
}
.cart-total-row span { font-size: 15px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: var(--fg-muted); }
.cart-total-row strong { font-family: var(--font-display); font-size: 30px; font-weight: 700; color: var(--gold-bright); }

.cart-checkout .form-row { gap: 0; }
.cart-checkout .field { margin-bottom: 14px; }
.cart-checkout .field label { font-size: 13px; }
.cart-checkout .field input, .cart-checkout .field textarea {
  min-height: 46px; font-size: 17px; padding: 10px 12px;
}
.cart-checkout textarea { min-height: 64px; }

/* ---------- Modals ---------- */
.modal {
  position: fixed; inset: 0; z-index: 130;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background: rgba(5, 4, 2, 0.8);
  backdrop-filter: blur(3px);
  opacity: 0; visibility: hidden;
  transition: opacity var(--speed) ease, visibility var(--speed) ease;
}
.modal.open { opacity: 1; visibility: visible; }

.modal-card {
  width: 100%; max-width: 420px;
  padding: 40px 30px 34px;
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  box-shadow: var(--shadow-pop);
  text-align: center;
  transform: translateY(12px) scale(0.98);
  transition: transform var(--speed) ease;
}
.modal.open .modal-card { transform: none; }

.modal-icon {
  width: 76px; height: 76px; margin: 0 auto 18px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--gold); border-radius: 50%;
  color: var(--gold); background: rgba(201, 151, 31, 0.08);
}
.modal-icon .icon { width: 38px; height: 38px; }
.modal-title { font-family: var(--font-display); font-size: 26px; font-weight: 700; }
.modal-text { margin-top: 8px; font-size: 18px; color: var(--fg-muted); }

.order-confirm { margin: 22px 0; padding: 20px; background: var(--bg); border: 1px solid var(--border-strong); }
.order-confirm-label { font-size: 13px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); }
.order-confirm-number { font-family: var(--font-display); font-size: 34px; font-weight: 800; margin: 4px 0; }
.order-confirm-details { font-size: 18px; color: var(--fg-muted); }

/* ---------- Lightbox ---------- */
.lightbox {
  position: fixed; inset: 0; z-index: 140;
  display: flex; align-items: center; justify-content: center;
  background: rgba(5, 4, 2, 0.92);
  opacity: 0; visibility: hidden;
  transition: opacity var(--speed) ease, visibility var(--speed) ease;
}
.lightbox.open { opacity: 1; visibility: visible; }

.lb-figure { max-width: min(92vw, 960px); display: flex; flex-direction: column; margin: 0; }
.lb-figure img {
  max-width: 100%; max-height: 78vh; object-fit: contain;
  border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-pop);
}
#lb-caption {
  margin-top: 14px; padding: 10px 16px;
  font-size: 17px; font-weight: 600; text-align: center;
  color: var(--fg);
  background: rgba(10, 8, 5, 0.7); border: 1px solid var(--border);
}

.lb-btn {
  position: absolute; z-index: 1;
  width: 52px; height: 52px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border-strong); border-radius: 50%;
  font-family: var(--font-display); font-size: 30px; line-height: 1;
  color: var(--gold-bright); background: rgba(10, 8, 5, 0.75);
  transition: all var(--speed) ease;
}
.lb-btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(10, 8, 5, 0.95); }
.lb-close { top: 20px; right: 20px; }
.lb-prev { left: 16px; top: 50%; transform: translateY(-50%); }
.lb-next { right: 16px; top: 50%; transform: translateY(-50%); }

/* ---------- Toasts ---------- */
.toasts {
  position: fixed; top: calc(var(--nav-h) + 12px); left: 50%; transform: translateX(-50%);
  z-index: 150; width: min(92vw, 440px);
  display: flex; flex-direction: column; gap: 10px;
  pointer-events: none;
}
.toast {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  border-left: 3px solid var(--gold);
  border-radius: var(--radius);
  box-shadow: var(--shadow-pop);
  animation: toastIn 0.35s ease;
}
.toast.error { border-left-color: var(--danger); }
.toast.leaving { animation: toastOut 0.3s ease forwards; }
.toast .icon { margin-top: 2px; color: var(--gold); }
.toast.error .icon { color: var(--danger); }
.toast-body strong { display: block; font-size: 17px; }
.toast-body span { display: block; font-size: 15px; color: var(--fg-muted); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-8px); } }

/* ---------- Reveal on scroll ---------- */
.reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s ease, transform 0.7s ease; }
.reveal.visible { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .reveal { opacity: 1; transform: none; transition: none; }
  .scroll-hint { animation: none; }
}

/* ---------- Spinner (placing order) ---------- */
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Responsive ---------- */
@media (min-width: 640px) {
  .stats-panel { grid-template-columns: repeat(3, 1fr); }
  .stat { flex-direction: column; text-align: center; gap: 8px; }
  .gallery-grid { grid-template-columns: repeat(3, 1fr); }
  .price-list { grid-template-columns: 1fr 1fr; }
}

@media (min-width: 768px) {
  .section { padding: 112px 0; }
  .form-row { grid-template-columns: 1fr 1fr; }
  .menu-panel-card { padding: 48px 56px 56px; }
  .res-grid { grid-template-columns: 1fr 1.2fr; gap: 48px; }
  .hours-grid { grid-template-columns: repeat(2, 1fr); }
  .map-card { grid-column: span 2; }
  .footer-grid { grid-template-columns: repeat(3, 1fr); }
  .hero-frame { display: block; }
  .form-card { padding: 40px 44px; }
}

@media (min-width: 1024px) {
  .nav-links { display: flex; }
  .nav-cta { display: inline-flex; }
  .hamburger { display: none; }
  .gallery-grid { grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .featured-grid { grid-template-columns: repeat(3, 1fr); }
  .hours-grid { grid-template-columns: repeat(3, 1fr); }
  .map-card { grid-column: auto; }
}

/* ============================================================
   ACCOUNT AREA (navbar, all pages)
   ============================================================ */
.nav-account { display: flex; align-items: center; gap: 14px; }
.account-link {
  font-family: var(--font-body); font-size: 17px; font-weight: 600; letter-spacing: 0.04em;
  color: var(--fg); border-bottom: 1px solid transparent; padding: 2px 0;
}
.account-link:hover { color: var(--gold-bright); border-bottom-color: var(--gold); }
.admin-link { color: var(--gold); font-weight: 700; }
.admin-link:hover { color: var(--gold-bright); border-bottom-color: var(--gold-bright); }
.account-name { font-size: 15px; color: var(--fg-muted); letter-spacing: 0.03em; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.account-logout, .mobile-logout {
  font-size: 15px; font-weight: 600; letter-spacing: 0.04em; color: var(--fg-muted);
  border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 5px 12px;
  transition: color var(--speed) ease, border-color var(--speed) ease, background var(--speed) ease;
}
.account-logout:hover, .mobile-logout:hover { color: var(--danger); border-color: var(--danger); background: rgba(255, 80, 80, 0.06); }
.mobile-nav-account {
  display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
  padding: 14px 0; margin: 6px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
}
.mobile-account-name { font-size: 16px; color: var(--fg-muted); }
@media (max-width: 900px) {
  .nav-account .account-name { display: none; }
}

/* ============================================================
   LOGIN PORTAL (login.html)
   ============================================================ */
.auth-body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 18px 30px; }
.auth-wrap { width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.auth-brand { display: flex; align-items: center; gap: 14px; }
.auth-brand-name { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--fg); letter-spacing: 0.02em; }
.auth-card { width: 100%; padding: 36px 34px 30px; position: relative; }
.auth-title { font-family: var(--font-display); font-size: 34px; font-weight: 700; text-align: center; letter-spacing: 0.02em; }
.auth-sub { text-align: center; color: var(--fg-muted); font-size: 17px; margin: 8px 0 22px; }
.auth-tabs { margin-bottom: 24px; }
.auth-form { display: flex; flex-direction: column; }
.auth-form .btn { margin-top: 4px; }
.auth-note { text-align: center; font-size: 15px; color: var(--fg-muted); margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
.auth-note strong { color: var(--gold-bright); }
.auth-back { font-size: 16px; color: var(--fg-muted); letter-spacing: 0.03em; }
.auth-back:hover { color: var(--gold-bright); }

.field-error { font-size: 14px; color: var(--danger); min-height: 18px; margin: 4px 2px 2px; opacity: 0; transition: opacity var(--speed) ease; }
.field-error.visible { opacity: 1; }
.field input.invalid, .field select.invalid, .field textarea.invalid { border-color: var(--danger); box-shadow: 0 0 0 1px rgba(255, 90, 90, 0.25); }

.admin-notice {
  display: flex; gap: 12px; align-items: flex-start;
  border: 1px solid var(--border-strong); border-left: 3px solid var(--gold); border-radius: var(--radius);
  background: rgba(201, 151, 31, 0.07); padding: 14px 16px; margin-bottom: 20px;
}
.admin-notice .icon { width: 22px; height: 22px; color: var(--gold-bright); flex-shrink: 0; margin-top: 2px; }
.admin-notice strong { display: block; font-family: var(--font-display); font-size: 16px; color: var(--gold-bright); margin-bottom: 3px; }
.admin-notice span { font-size: 15px; color: var(--fg-muted); line-height: 1.45; }

.auth-signedin { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 12px 0 4px; }
.auth-signedin-icon {
  width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--border-strong);
  display: flex; align-items: center; justify-content: center; margin-bottom: 10px;
  background: radial-gradient(circle at 50% 35%, rgba(201, 151, 31, 0.18), transparent 70%);
}
.auth-signedin-icon .icon { width: 30px; height: 30px; color: var(--gold-bright); }
.auth-signedin-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 18px; }

/* ============================================================
   ADMIN PANEL (admin.html)
   ============================================================ */
.admin-body { background-color: var(--bg); min-height: 100vh; }
.admin-header { position: sticky; top: 0; z-index: 50; background: rgba(10, 8, 5, 0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.admin-header-inner { max-width: 1120px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.admin-header .brand { display: flex; align-items: center; gap: 12px; }
.admin-header-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.admin-user { font-size: 15px; color: var(--fg-muted); letter-spacing: 0.03em; }
.btn-sm { font-size: 15px; padding: 7px 14px; }

.admin-main { max-width: 1120px; margin: 0 auto; padding: 40px 24px 70px; }
.admin-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 26px; }
.admin-title { font-family: var(--font-display); font-size: clamp(28px, 4vw, 40px); font-weight: 700; letter-spacing: 0.02em; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.admin-source { color: var(--fg-muted); font-size: 16px; margin-top: 6px; }
.admin-toolbar { display: flex; gap: 12px; flex-wrap: wrap; }
.dirty-badge {
  font-family: var(--font-body); font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--gold-bright); border: 1px solid var(--gold-deep); border-radius: 999px; padding: 5px 12px;
  background: rgba(201, 151, 31, 0.1); white-space: nowrap;
}
.btn-danger-outline { border: 1px solid var(--danger); color: var(--danger); border-radius: var(--radius); padding: 10px 18px; font-size: 16px; font-weight: 600; letter-spacing: 0.04em; transition: background var(--speed) ease; }
.btn-danger-outline:hover { background: rgba(255, 80, 80, 0.08); }

.admin-access { text-align: center; padding: 50px 30px; }
.admin-access-icon { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center; }
.admin-access-icon .icon { width: 28px; height: 28px; color: var(--danger); }
.admin-access-title { font-family: var(--font-display); font-size: 28px; margin-bottom: 8px; }
.admin-access-text { color: var(--fg-muted); margin-bottom: 22px; }
.admin-access-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

.admin-cat-card, .admin-dishes-card { padding: 26px 26px 24px; margin-bottom: 20px; }
.admin-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
.admin-meta-grid .field:last-child { grid-column: 1 / -1; }

.admin-dish-row { display: grid; grid-template-columns: 1fr 72px 44px; gap: 12px; align-items: center; margin-bottom: 12px; }
.dish-main { display: grid; grid-template-columns: 1fr 130px; gap: 8px 10px; align-items: center; }
.dish-main .dish-img { grid-column: 1 / -1; }
.dish-thumb {
  width: 72px; height: 72px;
  border: 1px solid var(--border-strong); border-radius: var(--radius);
  overflow: hidden; display: flex; align-items: center; justify-content: center;
  background: var(--bg-raise);
}
.dish-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dish-name, .dish-price, .dish-img, #new-dish-name, #new-dish-price, #new-dish-img {
  background: var(--bg-raise); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--fg); padding: 10px 12px; font-size: 17px; width: 100%;
  transition: border-color var(--speed) ease, box-shadow var(--speed) ease;
}
.dish-img, #new-dish-img { font-size: 14px; color: var(--fg-muted); }
.dish-name:focus, .dish-price:focus, .dish-img:focus, #new-dish-name:focus, #new-dish-price:focus, #new-dish-img:focus {
  outline: none; border-color: var(--gold); box-shadow: 0 0 0 1px rgba(201, 151, 31, 0.3);
}
.price-wrap { position: relative; display: flex; align-items: center; }
.price-wrap > span { position: absolute; left: 10px; color: var(--gold); font-size: 15px; pointer-events: none; }
.price-wrap input { padding-left: 26px; }
.dish-delete { color: var(--fg-muted); border-color: var(--border); }
.dish-delete:hover { color: var(--danger); border-color: var(--danger); background: rgba(255, 80, 80, 0.06); }

.admin-add-row { display: grid; grid-template-columns: 1fr 130px auto; gap: 10px 12px; align-items: center; margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--border-strong); }
.admin-add-row #new-dish-img { grid-column: 1 / -1; }
.admin-empty { color: var(--fg-muted); font-style: italic; padding: 10px 0; }
.admin-info { margin-top: 34px; padding: 22px 24px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-raise); }
.admin-info h3 { font-family: var(--font-display); font-size: 20px; color: var(--gold-bright); margin-bottom: 10px; }
.admin-info p { color: var(--fg-muted); font-size: 16px; margin-bottom: 8px; line-height: 1.5; }
.admin-info code { font-family: monospace; color: var(--gold-bright); background: rgba(201, 151, 31, 0.1); padding: 1px 6px; border-radius: 3px; }

@media (max-width: 720px) {
  .admin-meta-grid { grid-template-columns: 1fr; }
  .admin-dish-row { grid-template-columns: 1fr 58px 44px; gap: 8px; }
  .dish-main { grid-template-columns: 1fr 96px; }
  .dish-thumb { width: 58px; height: 58px; }
  .admin-add-row { grid-template-columns: 1fr; }
  .admin-head { align-items: flex-start; flex-direction: column; }
  .auth-card { padding: 28px 20px 24px; }
  .auth-title { font-size: 28px; }
}

/* ============================================================
   ADMIN PANEL - RESERVATIONS VIEW
   ============================================================ */
.res-card { padding: 26px 26px 24px; }
.res-card-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px 18px; flex-wrap: wrap; margin-bottom: 18px;
}
.res-toolbar { display: flex; gap: 10px; flex-wrap: wrap; }

.res-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
.res-stat {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: linear-gradient(165deg, rgba(201, 151, 31, 0.07), rgba(10, 8, 5, 0) 60%), var(--bg-raise);
  padding: 14px 16px; text-align: center;
}
.res-stat-num { display: block; font-family: var(--font-display); font-size: 30px; font-weight: 700; color: var(--gold-bright); line-height: 1.1; }
.res-stat-label { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--fg-muted); }

.res-access { padding: 18px 20px; border: 1px dashed var(--border-strong); border-radius: var(--radius); margin-bottom: 20px; }
.res-access h3 { font-family: var(--font-display); font-size: 19px; color: var(--gold-bright); margin-bottom: 6px; }
.res-access p { color: var(--fg-muted); font-size: 15px; margin-bottom: 14px; line-height: 1.5; }
.res-key-row { display: flex; gap: 10px; flex-wrap: wrap; }
#res-admin-key {
  flex: 1 1 220px; background: var(--bg-raise); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--fg); padding: 10px 12px; font-size: 16px; letter-spacing: 0.12em;
}
#res-admin-key:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 1px rgba(201, 151, 31, 0.3); }

.res-table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card); }
.admin-table { border-collapse: collapse; width: 100%; min-width: 980px; font-size: 15px; }
.admin-table th, .admin-table td {
  padding: 11px 14px; text-align: left; white-space: nowrap; vertical-align: top;
  border-bottom: 1px solid rgba(201, 151, 31, 0.14);
}
.admin-table thead th {
  font-family: var(--font-display); font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--gold-bright); background: var(--bg-raise);
  border-bottom: 1px solid var(--border-strong);
  position: sticky; top: 0;
}
.admin-table tbody tr:hover { background: rgba(201, 151, 31, 0.05); }
.admin-table tbody tr:last-child td { border-bottom: none; }
.res-idx { color: var(--fg-muted); font-size: 13px; }
.res-name { font-weight: 700; }
.res-email, .res-muted { color: var(--fg-muted); font-size: 14px; }
.res-center { text-align: center !important; }
.res-notes { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }

@media (max-width: 720px) {
  .res-stats { grid-template-columns: 1fr; }
  .res-card { padding: 20px 14px; }
  .res-card-head { flex-direction: column; align-items: stretch; }
  .res-toolbar { justify-content: flex-end; }
}

/* ============================================================
   ADMIN PANEL - GALLERY MANAGEMENT
   ============================================================ */
.admin-view-tabs { margin-bottom: 24px; }
.admin-view-tabs .tab-btn { display: inline-flex; align-items: center; gap: 9px; font-size: 17px; padding: 11px 20px; }
.admin-view-tabs .tab-btn .icon { width: 18px; height: 18px; }
.admin-gallery-card { padding: 26px 26px 24px; }

.g-item {
  display: grid; grid-template-columns: 140px 1fr 44px; gap: 18px; align-items: start;
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-raise);
  padding: 16px; margin-bottom: 14px;
}
.g-thumb {
  width: 140px; height: 100px; border: 1px solid var(--border-strong); border-radius: var(--radius);
  overflow: hidden; background: var(--bg); display: flex; align-items: center; justify-content: center;
}
.g-thumb img { width: 100%; height: 100%; object-fit: cover; }
.g-thumb-empty { font-size: 13px; color: var(--fg-muted); letter-spacing: 0.03em; }
.g-fields .field { margin-bottom: 14px; }
.g-fields .field:last-child { margin-bottom: 0; }
.g-src-row { display: flex; gap: 10px; align-items: stretch; }
.g-src-row input { flex: 1; min-width: 0; }
.g-upload { white-space: nowrap; display: inline-flex; align-items: center; cursor: pointer; }
.g-hint { font-size: 13px; color: var(--fg-muted); margin: 5px 2px 0; }
.g-actions { display: flex; flex-direction: column; gap: 8px; }
.g-add { margin-top: 8px; }

@media (max-width: 720px) {
  .g-item { grid-template-columns: 1fr; gap: 12px; }
  .g-thumb { width: 100%; height: 150px; }
  .g-actions { flex-direction: row; }
  .g-src-row { flex-direction: column; }
}


/* ============================================================
   LUXURY VINTAGE WATCH / HERITAGE CLOCK (Old Money Horology)
   ============================================================ */
.heritage-clock-card {
  background: radial-gradient(circle at 50% 30%, #1a2f24 0%, #102117 70%, #0c1811 100%);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 32px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  position: relative;
  overflow: hidden;
  box-shadow: 0 16px 40px -12px rgba(4, 10, 7, 0.9);
}
.heritage-clock-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
}
.vintage-watch {
  position: relative;
  width: 260px;
  height: 260px;
  margin: 12px auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.watch-crown {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  width: 32px;
  height: 12px;
  background: linear-gradient(90deg, #8f7243, #dfc89f, #8f7243);
  border-radius: 4px 4px 1px 1px;
  box-shadow: 0 -2px 6px rgba(0,0,0,0.4);
}
.watch-crown::after {
  content: '';
  position: absolute;
  top: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 22px;
  height: 6px;
  border-radius: 2px;
  background: #c8a876;
}
.watch-case {
  width: 250px;
  height: 250px;
  border-radius: 50%;
  padding: 10px;
  background: radial-gradient(circle at 35% 25%, #dfc89f 0%, #b8935c 40%, #755a30 75%, #463417 100%);
  box-shadow:
    inset 0 2px 4px rgba(255, 255, 255, 0.4),
    inset 0 -4px 8px rgba(0, 0, 0, 0.7),
    0 16px 36px -8px rgba(0, 0, 0, 0.85),
    0 0 0 1px rgba(200, 168, 118, 0.35);
  position: relative;
}
.watch-bezel {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  padding: 6px;
  background: radial-gradient(circle at 65% 75%, #5a4220 0%, #2e2110 80%);
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8);
}
.watch-dial {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, #183325 0%, #0e2017 65%, #08130d 100%);
  border: 1px solid rgba(200, 168, 118, 0.4);
  position: relative;
  box-shadow: inset 0 4px 16px rgba(0, 0, 0, 0.7);
}
.dial-railroad {
  position: absolute;
  inset: 12px;
  border-radius: 50%;
  border: 1px dashed rgba(200, 168, 118, 0.3);
  pointer-events: none;
}
.dial-inner-ring {
  position: absolute;
  inset: 48px;
  border-radius: 50%;
  border: 1px solid rgba(200, 168, 118, 0.18);
  pointer-events: none;
}

/* Roman Numerals */
.numeral {
  position: absolute;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--gold-bright);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
  transform: translate(-50%, -50%);
  pointer-events: none;
}
.num-12 { top: 16%; left: 50%; font-size: 16px; font-weight: 800; }
.num-1  { top: 21%; left: 70%; }
.num-2  { top: 32%; left: 84%; }
.num-3  { top: 50%; left: 88%; font-size: 15px; }
.num-4  { top: 68%; left: 84%; }
.num-5  { top: 79%; left: 70%; }
.num-6  { top: 84%; left: 50%; font-size: 15px; }
.num-7  { top: 79%; left: 30%; }
.num-8  { top: 68%; left: 16%; }
.num-9  { top: 50%; left: 12%; font-size: 15px; }
.num-10 { top: 32%; left: 16%; }
.num-11 { top: 21%; left: 30%; }

.watch-brand {
  position: absolute;
  top: 31%;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-display);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.16em;
  color: var(--gold-bright);
  text-transform: uppercase;
  white-space: nowrap;
}
.watch-subline {
  position: absolute;
  top: 37%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 8px;
  letter-spacing: 0.22em;
  color: var(--fg-muted);
  text-transform: uppercase;
  white-space: nowrap;
  opacity: 0.8;
}

/* Date aperture at 6 o'clock */
.watch-date-window {
  position: absolute;
  bottom: 24%;
  left: 50%;
  transform: translateX(-50%);
  background: #0a140e;
  border: 1px solid var(--gold);
  border-radius: 2px;
  padding: 1px 7px;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.8);
}
.watch-date-window span {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 700;
  color: var(--gold-bright);
}

/* Watch Hands */
.hand {
  position: absolute;
  bottom: 50%;
  left: 50%;
  transform-origin: 50% 100%;
  border-radius: 2px;
  pointer-events: none;
  transition: transform 0.08s cubic-bezier(0.4, 2.08, 0.55, 0.44);
}
.hour-hand {
  width: 4px;
  height: 52px;
  margin-left: -2px;
  background: linear-gradient(to top, #8f7243, #dfc89f);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
  z-index: 5;
}
.hour-hand::after {
  content: '';
  position: absolute;
  top: -6px;
  left: -2px;
  width: 8px;
  height: 8px;
  transform: rotate(45deg);
  background: #dfc89f;
}
.min-hand {
  width: 3px;
  height: 74px;
  margin-left: -1.5px;
  background: linear-gradient(to top, #b8935c, #f8f5ee);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
  z-index: 6;
}
.min-hand::after {
  content: '';
  position: absolute;
  top: -5px;
  left: -1.5px;
  width: 6px;
  height: 6px;
  transform: rotate(45deg);
  background: #f8f5ee;
}
.sec-hand {
  width: 1.5px;
  height: 88px;
  margin-left: -0.75px;
  background: #dfc89f;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
  z-index: 7;
}
.sec-hand::before {
  content: '';
  position: absolute;
  bottom: -16px;
  left: -1px;
  width: 3.5px;
  height: 16px;
  background: #8f7243;
}
.watch-pin {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: radial-gradient(circle, #f8f5ee 30%, #dfc89f 70%, #755a30 100%);
  border: 1px solid #4a381b;
  box-shadow: 0 2px 5px rgba(0,0,0,0.8);
  z-index: 8;
}

/* Clock Readout & Live Status */
.clock-readout {
  margin-top: 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.clock-live-time {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--gold-bright);
}
.clock-live-date {
  font-size: 15px;
  color: var(--fg-muted);
  letter-spacing: 0.04em;
}
.clock-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  padding: 6px 16px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border: 1px solid var(--border);
  background: rgba(22, 41, 30, 0.7);
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 8px var(--success);
}
.clock-status-badge.closed .status-dot {
  background: #cf5d5d;
  box-shadow: 0 0 8px #cf5d5d;
}
.clock-status-badge.closed {
  color: #ff9e9e;
  border-color: rgba(207, 93, 93, 0.4);
}

/* ============================================================
   LUXURY HERITAGE CALENDAR (Date Selection)
   ============================================================ */
.calendar-field {
  grid-column: 1 / -1;
}
.heritage-calendar {
  background: #112217;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 22px 20px;
  margin-top: 6px;
  box-shadow: 0 8px 24px -10px rgba(0, 0, 0, 0.6);
  user-select: none;
}
.cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.cal-month-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  color: var(--gold-bright);
  letter-spacing: 0.06em;
}
.cal-nav-btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--gold);
  background: rgba(200, 168, 118, 0.05);
  font-size: 18px;
  transition: all var(--speed) ease;
}
.cal-nav-btn:hover:not(:disabled) {
  border-color: var(--gold-bright);
  color: var(--fg);
  background: rgba(200, 168, 118, 0.16);
}
.cal-nav-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-muted);
  margin-bottom: 10px;
}
.cal-sat-head {
  color: #c97070;
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.cal-day {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: transparent;
  font-family: var(--font-display);
  font-size: 16px;
  color: var(--fg);
  transition: all var(--speed) ease;
  position: relative;
  min-height: 42px;
}
.cal-day:hover:not(.disabled) {
  border-color: var(--gold);
  background: rgba(200, 168, 118, 0.12);
  color: var(--gold-bright);
}
.cal-day.today::after {
  content: '';
  position: absolute;
  bottom: 4px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--gold-bright);
}
.cal-day.selected {
  background: linear-gradient(135deg, #dfc89f 0%, #c8a876 100%) !important;
  color: #0d1a13 !important;
  font-weight: 700 !important;
  border-color: #dfc89f !important;
  box-shadow: 0 4px 14px -3px rgba(200, 168, 118, 0.7);
}
.cal-day.selected::after {
  display: none;
}
.cal-day.disabled {
  opacity: 0.28;
  cursor: not-allowed;
  pointer-events: none;
}
.cal-day.saturday {
  background: rgba(207, 93, 93, 0.05);
  color: #d18282;
  position: relative;
}
.cal-day.saturday span.subtext {
  font-family: var(--font-body);
  font-size: 9px;
  letter-spacing: 0.05em;
  text-transform: uppercase;

/* Single Supabase client for the whole site.
 * Creates window.sb (the only client) or sets window.SB_CONFIG_ERROR with a clear reason.
 * Also exposes window.sbDiagnose() which pinpoints why requests fail. */
(function () {
  var cfg = window.APP_CONFIG || {};
  var url = String(cfg.supabaseUrl || '').trim().replace(/\/+$/, '');
  var key = String(cfg.supabasePublishableKey || cfg.supabaseAnonKey || '').trim();

  window.SB_CONFIG_ERROR = '';
  window.sb = null;

  function fail(msg, err) {
    window.SB_CONFIG_ERROR = msg;
    if (err) console.error(msg, err); else console.error(msg);
  }

  function jwtRole(token) {
    try {
      var part = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      while (part.length % 4) part += '=';
      return String(JSON.parse(atob(part)).role || '');
    } catch (e) { return ''; }
  }

  window.sbDiagnose = null;

  if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    return fail('Network problem: the Supabase JavaScript library could not be loaded from the CDN. Check your internet connection or ad-blocker.');
  }
  if (!url) {
    return fail('Supabase configuration missing: supabaseUrl is empty in config.js.');
  }
  if (!/^(https:\/\/[a-z0-9.-]+\.[a-z]{2,}|http:\/\/(localhost|127\.0\.0\.1)(:\d+)?)$/i.test(url)) {
    return fail('Invalid Supabase URL "' + url + '". It must look like https://YOUR-PROJECT-REF.supabase.co (no path, no trailing slash).');
  }
  if (!key || /^YOUR_/i.test(key) || /placeholder|undefined|null/i.test(key)) {
    return fail('Supabase configuration missing: the publishable key in config.js is not set. Copy it from Supabase Dashboard \u2192 Project Settings \u2192 API Keys \u2192 Publishable key, and set supabasePublishableKey in config.js.');
  }
  if (/^sb_secret_/i.test(key) || jwtRole(key) === 'service_role') {
    return fail('A secret/service-role key was detected in config.js. Remove it immediately (rotate it in Supabase) and use the publishable key instead.');
  }
  if (!/^sb_publishable_[A-Za-z0-9_-]+$/.test(key) && !/^eyJ[\w-]+\.[\w-]+\.[\w-]+$/.test(key)) {
    return fail('Invalid Supabase publishable key format. It should start with "sb_publishable_" (or be the legacy anon key starting with "eyJ").');
  }

  try {
    window.sb = window.supabase.createClient(url, key, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        flowType: 'pkce'
      }
    });
  } catch (e) {
    window.sb = null;
    return fail('Supabase could not be initialized. Check the Project URL and publishable key in config.js.', e);
  }

  /* Reachability check against the Auth API. Never logs keys or tokens. */
  var diagPromise = null;
  window.sbDiagnose = function () {
    if (diagPromise) return diagPromise;
    diagPromise = (async function () {
      try {
        var res = await fetch(url + '/auth/v1/settings', { headers: { apikey: key } });
        if (res.status === 401 || res.status === 403) {
          return { ok: false, kind: 'key', message: 'Invalid Supabase publishable key: the project rejected it. Copy the current Publishable key from Supabase Dashboard \u2192 Project Settings \u2192 API Keys into config.js.' };
        }
        if (res.status === 404) {
          return { ok: false, kind: 'url', message: 'Invalid Supabase URL: the project was not found at ' + url + '. Check the project reference in config.js.' };
        }
        if (!res.ok) {
          return { ok: false, kind: 'server', message: 'Supabase responded with HTTP ' + res.status + '. The project may be paused or unavailable \u2014 check the Supabase Dashboard.' };
        }
        var s = {};
        try { s = await res.json(); } catch (e) { /* ignore */ }
        return { ok: true, signupDisabled: !!s.disable_signup, settings: s };
      } catch (e) {
        return { ok: false, kind: 'network', message: 'Network/CORS connection problem: the browser could not reach ' + url + '. Check the Project URL for typos (the project reference must be exact), make sure the project is not paused, and check your internet connection, VPN or ad-blocker. If the page was opened as a file://, serve it over http(s) instead.' };
      }
    })();
    return diagPromise;
  };
})();

'use strict';

const AUTH_EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const AUTH_PASSWORD_RE = /^(?=.{8,72}$)(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d]).*$/;

function authEsc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
  });
}

function notify(title, message, type) {
  var wrap = document.getElementById('toasts');
  if (!wrap) return;
  var t = document.createElement('div');
  t.className = 'toast' + (type === 'error' ? ' error' : '');
  t.innerHTML = '<svg class="icon" aria-hidden="true"><use href="#icon-' + (type === 'error' ? 'mail' : 'check') + '"/></svg><div class="toast-body"><strong>' + authEsc(title) + '</strong><span>' + authEsc(message) + '</span></div>';
  wrap.appendChild(t);
  setTimeout(function () {
    t.classList.add('leaving');
    setTimeout(function () { t.remove(); }, 320);
  }, 4800);
}

function authReady() {
  if (window.SB_CONFIG_ERROR) return { ok:false, error:window.SB_CONFIG_ERROR };
  if (!window.sb || !window.sb.auth) return { ok:false, error:'Supabase authentication is not initialized. Check your Supabase configuration.' };
  return { ok:true };
}

function friendlyAuthError(error, action) {
  var message = error && error.message ? String(error.message) : String(error || 'Unknown error');
  var lower = message.toLowerCase();
  var status = error && error.status;
  if (lower === 'failed to fetch' || lower.indexOf('networkerror') >= 0 || lower.indexOf('load failed') >= 0 || lower.indexOf('network request failed') >= 0) {
    return 'Network/CORS connection problem: the browser could not reach Supabase. Check the Project URL in config.js, your internet connection, and that the Supabase project is not paused.';
  }
  if (lower.indexOf('invalid api key') >= 0 || lower.indexOf('invalid jwt') >= 0 || lower.indexOf('no api key') >= 0 || status === 401) {
    return 'Invalid Supabase publishable key. Copy the current Publishable key from Supabase Dashboard \u2192 Project Settings \u2192 API Keys into config.js.';
  }
  if (lower.indexOf('invalid login credentials') >= 0) return 'Incorrect email or password.';
  if (lower.indexOf('email not confirmed') >= 0) return 'Email confirmation required: please confirm your email address (check your inbox) before signing in.';
  if (lower.indexOf('already registered') >= 0 || lower.indexOf('already been registered') >= 0 || lower.indexOf('user_already_exists') >= 0) return 'Email already registered. Please use Sign In instead.';
  if (lower.indexOf('password should be at least') >= 0 || lower.indexOf('password should contain') >= 0 || lower.indexOf('weak password') >= 0 || lower.indexOf('weak_password') >= 0) return 'Invalid password: it does not meet the Supabase password policy.';
  if (lower.indexOf('unable to validate email') >= 0 || lower.indexOf('invalid format') >= 0 || lower.indexOf('is invalid') >= 0 && lower.indexOf('email') >= 0) return 'Invalid email address.';
  if (lower.indexOf('rate limit') >= 0 || status === 429) return 'Too many attempts or emails sent. Please wait a few minutes and try again.';
  if (lower.indexOf('signups not allowed') >= 0 || lower.indexOf('signup is disabled') >= 0 || lower.indexOf('signup_disabled') >= 0) return 'New account registration is disabled in Supabase. Enable email sign-ups in Supabase Dashboard \u2192 Authentication \u2192 Providers \u2192 Email.';
  if (lower.indexOf('database error') >= 0) return 'Database/profile creation failed: run the latest supabase/schema.sql in the Supabase SQL Editor, then try again. (' + message + ')';
  return message || (action + ' failed. Please try again.');
}

/* When a request fails at the network level, find out the real cause. */
async function explainAuthFailure(error, action) {
  var msg = friendlyAuthError(error, action);
  var raw = error && error.message ? String(error.message).toLowerCase() : '';
  var isNetwork = raw === 'failed to fetch' || raw.indexOf('networkerror') >= 0 || raw.indexOf('load failed') >= 0 || raw.indexOf('network request failed') >= 0;
  if (isNetwork && typeof window.sbDiagnose === 'function') {
    try {
      var d = await window.sbDiagnose();
      if (d && !d.ok && d.message) return d.message;
    } catch (e) { /* keep default message */ }
  }
  return msg;
}

var currentUserCache = null;

async function fetchProfile(authUser) {
  var ready = authReady();
  if (!ready.ok) throw new Error(ready.error);
  var meta = (authUser && authUser.user_metadata) || {};
  var email = ((authUser && authUser.email) || '').toLowerCase();
  var fallbackName = String(meta.full_name || email.split('@')[0] || 'Guest');
  var r = await window.sb.from('profiles').select('id,full_name,role,created_at').eq('id', authUser.id).maybeSingle();
  if (r.error || !r.data) {
    // The profile row is created by a database trigger. If it cannot be read, keep the user
    // signed in as a normal (non-admin) user instead of failing the whole login/registration.
    console.warn('Profile row unavailable (run the latest supabase/schema.sql):', r.error ? r.error.message : 'no row found');
    return { id:authUser.id, name:fallbackName, email:email, role:'user', createdAt:null, profileMissing:true };
  }
  return {
    id:r.data.id,
    name:r.data.full_name || fallbackName,
    email:email,
    role:r.data.role,
    createdAt:r.data.created_at
  };
}

async function getCurrentUser() {
  if (currentUserCache) return currentUserCache;
  var ready = authReady();
  if (!ready.ok) return null;
  try {
    var s = await window.sb.auth.getSession();
    if (s.error || !s.data.session) return null;
    var r = await window.sb.auth.getUser(); // verifies the session with the Auth server
    if (r.error || !r.data.user) return null;
    currentUserCache = await fetchProfile(r.data.user);
    return currentUserCache;
  } catch (e) {
    console.warn('Could not load current user:', e && e.message ? e.message : e);
    return null;
  }
}

function isAdminUser(user) { return !!user && user.role === 'admin'; }

async function registerUser(name, email, password) {
  var ready = authReady();
  if (!ready.ok) return { ok:false, error:ready.error };

  var cleanName = String(name).trim();
  var cleanEmail = String(email).trim().toLowerCase();
  if (cleanName.length < 2) return {ok:false,error:'Please enter your full name.'};
  if (!AUTH_EMAIL_RE.test(cleanEmail)) return {ok:false,error:'Invalid email address.'};
  if (!AUTH_PASSWORD_RE.test(password)) return {ok:false,error:'Invalid password: use 8\u201372 characters with at least one uppercase letter, one lowercase letter, one number, and one special character.'};

  try {
    var signupOptions = { data:{full_name:cleanName} };
    if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
      signupOptions.emailRedirectTo = new URL(window.location.pathname + '#login', window.location.href).href;
    }
    var r = await window.sb.auth.signUp({
      email:cleanEmail,
      password:password,
      options:signupOptions
    });
    if (r.error) return {ok:false,error:await explainAuthFailure(r.error,'Registration')};
    var u = r.data && r.data.user;
    if (!u) return {ok:false,error:'Account could not be created. Please try again.'};
    // With email confirmation on, Supabase hides duplicates by returning a user with no identities.
    if (Array.isArray(u.identities) && u.identities.length === 0) {
      return {ok:false,error:'Email already registered. Please use Sign In instead.'};
    }
    if (!r.data.session) return {ok:true,pendingConfirmation:true,email:cleanEmail};
    currentUserCache = await fetchProfile(u);
    return {ok:true,user:currentUserCache,profileWarning:!!currentUserCache.profileMissing};
  } catch (e) {
    return {ok:false,error:await explainAuthFailure(e,'Registration')};
  }
}

async function loginUser(email,password) {
  var ready = authReady();
  if (!ready.ok) return {ok:false,error:ready.error};
  var cleanEmail = String(email).trim().toLowerCase();
  if (!AUTH_EMAIL_RE.test(cleanEmail)) return {ok:false,error:'Invalid email address.'};
  if (!password) return {ok:false,error:'Please enter your password.'};

  try {
    var r = await window.sb.auth.signInWithPassword({email:cleanEmail,password:password});
    if (r.error) return {ok:false,error:await explainAuthFailure(r.error,'Sign in')};
    if (!r.data.user) return {ok:false,error:'Sign in did not return a user session. Please try again.'};
    currentUserCache = await fetchProfile(r.data.user);
    return {ok:true,user:currentUserCache};
  } catch (e) {
    return {ok:false,error:await explainAuthFailure(e,'Sign in')};
  }
}

async function logoutUser() {
  currentUserCache = null;
  if (window.sb && window.sb.auth) {
    try { await window.sb.auth.signOut(); } catch (e) { console.warn('Sign out failed:', e && e.message); }
  }
}

function renderAccountArea() {
  getCurrentUser().then(function(user) {
    var desktop=document.getElementById('nav-account'),mobile=document.getElementById('mobile-nav-account');
    if(desktop)desktop.innerHTML=user?((isAdminUser(user)?'<a href="#admin" class="account-link admin-link">Admin Panel</a>':'')+'<span class="account-name" title="'+authEsc(user.email)+'">Hi, '+authEsc(user.name.split(' ')[0])+'</span><button type="button" class="account-logout" data-logout>Logout</button>'):'<a href="#login" class="account-link">Login</a>';
    if(mobile)mobile.innerHTML=user?('<span class="mobile-account-name">Signed in as '+authEsc(user.name)+(isAdminUser(user)?' (Admin)':'')+'</span>'+(isAdminUser(user)?'<a href="#admin">Admin Panel</a>':'')+'<button type="button" class="mobile-logout" data-logout>Logout</button>'):'<a href="#login">Login</a>';
    document.querySelectorAll('[data-logout]').forEach(function(btn){btn.addEventListener('click',function(){logoutUser().then(function(){window.location.reload();});});});
  }).catch(function(e){console.warn('Could not load account state',e);});
}

document.addEventListener('DOMContentLoaded',renderAccountArea);

// Keep the cached user in sync with the Supabase session (login, logout, refresh, other tabs).
if (window.sb && window.sb.auth) {
  window.sb.auth.onAuthStateChange(function (event) {
    if (event === 'SIGNED_OUT' || event === 'SIGNED_IN' || event === 'USER_UPDATED') {
      currentUserCache = null;
    }
  });
}

    toggle.setAttribute('aria-expanded', 'false');
  };
  toggle.addEventListener('click', () => {
    const open = mobileNav.classList.toggle('open');
    toggle.setAttribute('aria-expanded', String(open));
  });
  $$('#mobile-nav a').forEach((a) => a.addEventListener('click', closeNav));
  document.addEventListener('click', (e) => {
    if (mobileNav.classList.contains('open') && !mobileNav.contains(e.target) && !toggle.contains(e.target)) {
      closeNav();
    }
  });
}

/* ---------------- Cart state ---------------- */
let cart = [];

function cartCount() {
  return cart.reduce((sum, it) => sum + it.quantity, 0);
}
function cartTotal() {
  return cart.reduce((sum, it) => sum + it.quantity * it.price, 0);
}

function addToCart(name) {
  const price = PRICES[name];
  if (price === undefined) return;
  const existing = cart.find((it) => it.name === name);
  if (existing) {
    existing.quantity = Math.min(MAX_QTY, existing.quantity + 1);
  } else {
    cart.push({ name, price, quantity: 1, notes: '' });
  }
  syncCart();
}

function changeQty(name, delta) {
  const item = cart.find((it) => it.name === name);
  if (!item) return;
  const next = item.quantity + delta;
  if (next < 1) {
    cart = cart.filter((it) => it.name !== name);
  } else {
    item.quantity = Math.min(MAX_QTY, next);
  }
  syncCart();
}

function removeItem(name) {
  cart = cart.filter((it) => it.name !== name);
  syncCart();
}

function setItemNotes(name, notes) {
  const item = cart.find((it) => it.name === name);
  if (item) item.notes = notes.slice(0, MAX_ITEM_NOTES);
}

/* Re-render every cart-dependent view (except notes typing). */
function syncCart() {
  refreshMenuRows();
  renderCart();
  updateBadge();
  updateSummaryBar();
}

function updateBadge() {
  const badge = $('#cart-badge');
  const count = cartCount();
  badge.textContent = count;
  badge.hidden = count === 0;
  $('#cart-btn').setAttribute(
    'aria-label',
    count > 0 ? `Open your order (${count} items)` : 'Open your order'
  );
}

function updateSummaryBar() {
  const bar = $('#order-summary-bar');
  const count = cartCount();
  bar.hidden = count === 0;
  if (count === 0) return;
  $('#order-summary-text').innerHTML =
    `<strong>${count}</strong> ${count === 1 ? 'dish' : 'dishes'} waiting in your royal order &middot; <strong>${INR(cartTotal())}</strong>`;
}

function openCart() {
  $('#cart-overlay').hidden = false;
